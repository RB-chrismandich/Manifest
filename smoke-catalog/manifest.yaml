version: 1
app: manifest
# Smoke catalog for the Manifest repo. Constitution Principle VI Verify gate:
# deterministic, browser-free (tier Lite, type cli) critical-path tests. Each
# builds a hermetic fixture home+project in a temp dir (never touches the real
# ~/.claude) and asserts exit 0. Coverage axes:
#   - deploy shape: what bootstrap links/copies (reconcile, antigravity, shared).
#   - deploy preservation: user runtime state that survives a redeploy — MCP
#     servers, opted-in issue-sync gates, and repo top-level defaults such as
#     skillListingBudgetFraction unioned into an existing settings.json
#     user-wins — the invariants whose silent regression corrupts a real
#     ~/.claude on the next `git pull && ./bootstrap.sh`.
#   - workflow critical path: CDDL orchestration is sub-agent only (manifest cddl
#     retired); role charters remain under configs/claude/prompts/cddl/.
#   - delegation critical path: manifest-delegate dispatches tasks/reviews to
#     external backend CLIs (delegate.py); foreground (--wait) and background
#     (--background + status/result/cancel, Constitution Principle VI) paths
#     both run against a hermetic stub backend, never a real external CLI.
#   - nightly (Full): deeper deploy e2e, cursor rule pruning, gemini hook merge,
#     and a deterministic Playwright UI fixture step.
#   - edge (Full+Extra): idempotent hook-merge regressions.
# Indentation follows the repo yamllint (indent-sequences); smoke_test.py append
# emits this style automatically but strips comments, so restore this header if
# a re-append drops it.
tests:
  - id: deploy-reconcile-preview
    title: deploy_reconcile.sh previews a hermetic fixture and exits 0
    tier: Lite
    steps:
      - name: reconcile_preview
        type: cli
        expect_exit: 0
        captures:
          remove_count: '"remove":\s*([0-9]+)'
        command:
          - bash
          - -c
          - "set -euo pipefail\nroot=\"$(git rev-parse --show-toplevel 2>/dev/null\
            \ || pwd)\"\nsb=\"$(mktemp -d)\"; trap 'rm -rf \"$sb\"' EXIT\nmkdir -p\
            \ \"$sb/home/.claude/skills/dead\" \"$sb/home/.claude/config\"\nmkdir\
            \ -p \"$sb/repo/.apm/skills/live\" \"$sb/repo/configs/claude/config\"\n\
            echo x > \"$sb/home/.claude/skills/dead/SKILL.md\"\necho \"y: 1\" > \"\
            $sb/home/.claude/config/command_config.yml\"\necho \"y: 1\" > \"$sb/repo/configs/claude/config/command_config.yml\"\
            \n\"$root/configs/claude/scripts/deploy_reconcile.sh\" \\\n  --home \"\
            $sb/home\" --project \"$sb/repo\" \\\n  --config \"$root/configs/claude/config/reconcile.yml\"\
            \ --json\n"
  - id: antigravity-deploy-reduced-set
    title: deploy_antigravity_configs links config/skills/.plans but not scripts/prompts
    tier: Lite
    steps:
      - name: antigravity_deploy
        type: cli
        expect_exit: 0
        captures:
          result: RESULT antigravity_reduced_set=(ok)
        command:
          - bash
          - -c
          - "set -euo pipefail\nGREEN='' CYAN='' NC='' BLUE='' YELLOW='' RED='' BOLD=''\n\
            root=\"$(git rev-parse --show-toplevel 2>/dev/null || pwd)\"\nsb=\"$(mktemp\
            \ -d)\"; trap 'rm -rf \"$sb\"' EXIT\nexport TARGET_DIR=\"$sb/claude\"\n\
            export ANTIGRAVITY_TARGET_DIR=\"$sb/antigravity\"\nexport ENABLE_ANTIGRAVITY=true\n\
            mkdir -p \"$TARGET_DIR\"/scripts \"$TARGET_DIR\"/config \"$TARGET_DIR\"\
            /prompts \\\n  \"$TARGET_DIR\"/.plans \"$TARGET_DIR\"/skills\n# shellcheck\
            \ disable=SC1090\nsource \"$root/bootstrap/lib/common.sh\"\n# shellcheck\
            \ disable=SC1090\nsource \"$root/bootstrap/lib/deploy.sh\"\ndeploy_antigravity_configs\
            \ > /dev/null\nfor l in config skills .plans; do\n  [ -L \"$ANTIGRAVITY_TARGET_DIR/$l\"\
            \ ] || { echo \"FAIL: missing expected link $l\"; exit 1; }\ndone\nfor\
            \ l in scripts prompts; do\n  [ ! -e \"$ANTIGRAVITY_TARGET_DIR/$l\" ]\
            \ || { echo \"FAIL: agy must not carry orchestrator wiring: $l\"; exit\
            \ 1; }\ndone\necho \"RESULT antigravity_reduced_set=ok\"\n"
  - id: shared-asset-deploy-full-set
    title: link_shared_assets gives a standard assistant all five shared links
    tier: Lite
    steps:
      - name: shared_deploy
        type: cli
        expect_exit: 0
        captures:
          result: RESULT shared_asset_full_set=(ok)
        command:
          - bash
          - -c
          - "set -euo pipefail\nGREEN='' CYAN='' NC='' BLUE='' YELLOW='' RED='' BOLD=''\n\
            root=\"$(git rev-parse --show-toplevel 2>/dev/null || pwd)\"\nsb=\"$(mktemp\
            \ -d)\"; trap 'rm -rf \"$sb\"' EXIT\nexport TARGET_DIR=\"$sb/claude\"\n\
            mkdir -p \"$TARGET_DIR\"/scripts \"$TARGET_DIR\"/config \"$TARGET_DIR\"\
            /prompts \\\n  \"$TARGET_DIR\"/.plans \"$TARGET_DIR\"/skills\ndest=\"\
            $sb/gemini\"; mkdir -p \"$dest\"\n# shellcheck disable=SC1090\nsource\
            \ \"$root/bootstrap/lib/common.sh\"\nlink_shared_assets \"$dest\" \"SmokeAssistant\"\
            \ \"true\" > /dev/null\nfor l in scripts config prompts .plans skills;\
            \ do\n  [ -L \"$dest/$l\" ] || { echo \"FAIL: standard assistant missing\
            \ link $l\"; exit 1; }\ndone\necho \"RESULT shared_asset_full_set=ok\"\
            \n"
  - id: mcp-preserve-settings-local
    title: merge_claude_mcp_servers keeps user MCP servers across a redeploy
    tier: Lite
    steps:
      - name: mcp_preserve_settings_local
        type: cli
        expect_exit: 0
        captures:
          result: RESULT mcp_preserve=(ok)
        command:
          - bash
          - -c
          - "set -euo pipefail\nGREEN='' CYAN='' NC='' BLUE='' YELLOW='' RED='' BOLD=''\n\
            root=\"$(git rev-parse --show-toplevel 2>/dev/null || pwd)\"\nsb=\"$(mktemp\
            \ -d)\"; trap 'rm -rf \"$sb\"' EXIT\n# preserved = a real user's settings.local.json\
            \ (has their own MCP server)\nprintf '{\"mcpServers\":{\"userfoo\":{\"\
            url\":\"https://u\"}}}' > \"$sb/preserved.json\"\n# tgt = the repo-managed\
            \ copy about to overwrite it (has repo servers + other keys)\nprintf '{\"\
            mcpServers\":{\"repobar\":{\"url\":\"https://r\"}},\"permissions\":{\"\
            allow\":[]}}' > \"$sb/tgt.json\"\n# shellcheck disable=SC1090\nsource\
            \ \"$root/bootstrap/lib/common.sh\"\n# shellcheck disable=SC1090\nsource\
            \ \"$root/bootstrap/lib/deploy.sh\"\nmerge_claude_mcp_servers \"$sb/preserved.json\"\
            \ \"$sb/tgt.json\" > /dev/null\npython3 - \"$sb/tgt.json\" <<'PY'\nimport\
            \ json, sys\nd = json.load(open(sys.argv[1]))\nk = set(d.get(\"mcpServers\"\
            , {}))\nif not {\"userfoo\", \"repobar\"} <= k:\n    sys.exit(\"FAIL:\
            \ user/repo MCP server lost on redeploy: %s\" % sorted(k))\nif \"permissions\"\
            \ not in d:\n    sys.exit(\"FAIL: unrelated settings.local.json key dropped\"\
            )\nPY\necho \"RESULT mcp_preserve=ok\"\n"
  - id: issue-sync-gate-preserve
    title: preserve_issue_sync_gates carries opt-in gates across a redeploy
    tier: Lite
    steps:
      - name: issue_sync_gate_preserve
        type: cli
        expect_exit: 0
        captures:
          result: RESULT gate_preserve=(ok)
        command:
          - bash
          - -c
          - "set -euo pipefail\nGREEN='' CYAN='' NC='' BLUE='' YELLOW='' RED='' BOLD=''\n\
            root=\"$(git rev-parse --show-toplevel 2>/dev/null || pwd)\"\nsb=\"$(mktemp\
            \ -d)\"; trap 'rm -rf \"$sb\"' EXIT\n# preserved = user opted in via install_issue_hooks.sh\
            \ (enabled: true)\nprintf 'tool_policies:\\n  issue-sync-pr:\\n    enabled:\
            \ true\\n  other-skill:\\n    enabled: false\\n' > \"$sb/preserved.yml\"\
            \n# tgt = repo default copy that would silently disable the opt-in (enabled:\
            \ false)\nprintf 'tool_policies:\\n  issue-sync-pr:\\n    enabled: false\\\
            n  other-skill:\\n    enabled: false\\n' > \"$sb/tgt.yml\"\n# shellcheck\
            \ disable=SC1090\nsource \"$root/bootstrap/lib/common.sh\"\n# shellcheck\
            \ disable=SC1090\nsource \"$root/bootstrap/lib/deploy.sh\"\npreserve_issue_sync_gates\
            \ \"$sb/preserved.yml\" \"$sb/tgt.yml\" > /dev/null\npython3 - \"$sb/tgt.yml\"\
            \ <<'PY'\nimport re, sys\nt = open(sys.argv[1]).read()\npr = re.search(r'issue-sync-pr:\\\
            s*\\n\\s*enabled:\\s*(true|false)', t).group(1)\noth = re.search(r'other-skill:\\\
            s*\\n\\s*enabled:\\s*(true|false)', t).group(1)\nif pr != \"true\":\n\
            \    sys.exit(\"FAIL: opted-in issue-sync gate reverted to disabled on\
            \ redeploy\")\nif oth != \"false\":\n    sys.exit(\"FAIL: non-issue-sync\
            \ gate wrongly mutated (over-broad preserve)\")\nPY\necho \"RESULT gate_preserve=ok\"\
            \n"
  - id: settings-defaults-preserve
    title: merge_claude_runtime_settings delivers repo top-level default, user value
      wins
    tier: Lite
    steps:
      - name: settings_defaults
        type: cli
        expect_exit: 0
        captures:
          result: RESULT settings_defaults=(ok)
        command:
          - bash
          - -c
          - "set -euo pipefail\nGREEN='' CYAN='' NC='' BLUE='' YELLOW='' RED='' BOLD=''\n\
            root=\"$(git rev-parse --show-toplevel 2>/dev/null || pwd)\"\nsb=\"$(mktemp\
            \ -d)\"; trap 'rm -rf \"$sb\"' EXIT\n# src = the repo's own deployed settings.local.json\
            \ (real source of defaults)\nsrc=\"$root/configs/claude/settings.runtime.json\"\
            \n# tgt = an already-bootstrapped user file: has NO skill budget (must\
            \ be added)\n# alongside a custom key that must survive untouched.\nprintf\
            \ '{\"permissions\":{\"allow\":[\"Bash(ls:*)\"]}}' > \"$sb/tgt.json\"\n\
            # shellcheck disable=SC1090\nsource \"$root/bootstrap/lib/common.sh\"\n\
            # shellcheck disable=SC1090\nsource \"$root/bootstrap/lib/deploy.sh\"\n\
            merge_claude_runtime_settings \"$src\" \"$sb/tgt.json\" > /dev/null\n\
            python3 - \"$sb/tgt.json\" \"$src\" <<'PY'\nimport json, sys\ntgt = json.load(open(sys.argv[1]))\n\
            src = json.load(open(sys.argv[2]))\n# repo must actually ship the top-level\
            \ default we claim to propagate\nif src.get(\"skillListingBudgetFraction\"\
            ) != 0.05:\n    sys.exit(\"FAIL: repo settings.runtime.json no longer\
            \ ships skillListingBudgetFraction=0.05\")\n# the missing default must\
            \ have been unioned into the existing file\nif tgt.get(\"skillListingBudgetFraction\"\
            ) != 0.05:\n    sys.exit(\"FAIL: repo default not delivered to an existing\
            \ install\")\n# the user's own unrelated key must survive untouched\n\
            if \"Bash(ls:*)\" not in tgt.get(\"permissions\", {}).get(\"allow\", []):\n\
            \    sys.exit(\"FAIL: user's own permission rule dropped by the merge\"\
            )\n# env must NOT be shipped in settings.json (subprocess-only, no-op\
            \ for caching)\nif \"env\" in src:\n    sys.exit(\"FAIL: settings.runtime.json\
            \ ships an env block (subprocess-only, misleading)\")\nPY\necho \"RESULT\
            \ settings_defaults=ok\"\n"
  - id: deploy-force-runtime-preserve
    title: deploy_configs --force keeps plugins, sessions, and user MCP across redeploy
    tier: Full
    steps:
      - name: force_deploy_preserve
        type: cli
        expect_exit: 0
        captures:
          result: RESULT deploy_force=(ok)
        command:
          - bash
          - -c
          - 'set -euo pipefail

            GREEN='''' CYAN='''' NC='''' BLUE='''' YELLOW='''' RED='''' BOLD=''''

            root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"

            sb="$(mktemp -d)"; trap ''rm -rf "$sb"'' EXIT

            export SCRIPT_DIR="$root" HOME="$sb/home" FORCE=true

            export TARGET_DIR="$HOME/.claude" CURSOR_TARGET_DIR="$HOME/.cursor"

            export GEMINI_TARGET_DIR="$HOME/.gemini" CODEX_TARGET_DIR="$HOME/.codex"

            export ANTIGRAVITY_TARGET_DIR="$HOME/.antigravity" MANIFEST_OUTPUT_DIR="$HOME/.manifest/outputs"

            export ENABLE_CURSOR=false ENABLE_GEMINI=false ENABLE_CODEX=false ENABLE_ANTIGRAVITY=false

            source "$root/bootstrap/lib/common.sh"

            source "$root/bootstrap/lib/deploy.sh"

            write_services_config() { :; }

            deploy_cursor_configs() { :; }

            deploy_gemini_configs() { :; }

            deploy_codex_configs() { :; }

            deploy_antigravity_configs() { :; }

            deploy_sync_skills() { :; }

            mkdir -p "$TARGET_DIR/plugins/cache" "$TARGET_DIR/projects" "$TARGET_DIR/config"

            echo ''{"plugins":{"remember":1}}'' > "$TARGET_DIR/plugins/installed_plugins.json"

            echo session-data > "$TARGET_DIR/projects/abc.jsonl"

            echo user-settings > "$TARGET_DIR/settings.json"

            printf ''{"mcpServers":{"my-private":{"url":"https://mcp.internal.example/mcp"}}}''
            > "$TARGET_DIR/settings.local.json"

            deploy_configs > /dev/null

            [ -f "$TARGET_DIR/plugins/installed_plugins.json" ]

            [ -f "$TARGET_DIR/projects/abc.jsonl" ]

            [ -f "$TARGET_DIR/CLAUDE.md" ]

            [ -d "$TARGET_DIR/skills/code-audit" ]

            python3 - "$TARGET_DIR/settings.local.json" <<''INNER''

            import json, sys

            d = json.load(open(sys.argv[1]))

            assert d["mcpServers"]["my-private"]["url"] == "https://mcp.internal.example/mcp"

            INNER

            echo "RESULT deploy_force=ok"

            '
  - id: cursor-rules-orphan-prune
    title: deploy_cursor_configs prunes orphan rules removed from source
    tier: Full
    steps:
      - name: prune_orphan
        type: cli
        expect_exit: 0
        captures:
          result: RESULT cursor_prune=(ok)
        command:
          - bash
          - -c
          - 'set -euo pipefail

            GREEN='''' CYAN='''' NC='''' BLUE='''' YELLOW='''' RED='''' BOLD=''''

            root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"

            sb="$(mktemp -d)"; trap ''rm -rf "$sb"'' EXIT

            SRC="$sb/repo/configs/cursor/rules"

            mkdir -p "$SRC"

            export SCRIPT_DIR="$sb/repo" TARGET_DIR="$sb/home/.claude"

            export CURSOR_TARGET_DIR="$sb/home/.cursor" ENABLE_CURSOR=true

            printf body > "$SRC/alpha.mdc"

            printf body > "$SRC/beta.mdc"

            source "$root/bootstrap/lib/common.sh"

            source "$root/bootstrap/lib/deploy.sh"

            deploy_cursor_configs > /dev/null

            [ -f "$CURSOR_TARGET_DIR/rules/beta.mdc" ]

            rm -f "$SRC/beta.mdc"

            deploy_cursor_configs > /dev/null

            [ ! -e "$CURSOR_TARGET_DIR/rules/beta.mdc" ]

            [ -f "$CURSOR_TARGET_DIR/rules/alpha.mdc" ]

            echo "RESULT cursor_prune=ok"

            '
  - id: gemini-hooks-merge-preserve
    title: merge_settings_hooks unions repo hooks into an existing settings.json
    tier: Full
    steps:
      - name: hooks_merge
        type: cli
        expect_exit: 0
        captures:
          result: RESULT hooks_merge=(ok)
        command:
          - bash
          - -c
          - 'set -euo pipefail

            root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"

            sb="$(mktemp -d)"; trap ''rm -rf "$sb"'' EXIT

            SRC="$sb/src.json" TGT="$sb/tgt.json"

            printf ''{"hooks":{"BeforeAgent":[{"hooks":[{"name":"token-economy-reminder","type":"command","command":"echo
            reminder","timeout":5000}]}]}}'' > "$SRC"

            printf ''{"mcpServers":{"user-server":{"url":"https://example.test"}}}''
            > "$TGT"

            command_exists() { command -v "$1" >/dev/null 2>&1; }

            print_info() { :; }

            print_success() { :; }

            print_warning() { :; }

            source "$root/bootstrap/lib/deploy.sh"

            merge_settings_hooks "$SRC" "$TGT" > /dev/null

            python3 - "$TGT" <<''INNER''

            import json, sys

            d = json.load(open(sys.argv[1]))

            assert d["mcpServers"]["user-server"]["url"] == "https://example.test"

            assert d["hooks"]["BeforeAgent"][0]["hooks"][0]["name"] == "token-economy-reminder"

            INNER

            echo "RESULT hooks_merge=ok"

            '
  - id: bootstrap-smoke-ui-fixture
    title: Playwright UI step loads a committed fixture page and asserts visible copy
    tier: Full
    steps:
      - name: resolve_fixture
        type: cli
        expect_exit: 0
        captures:
          fixture_url: FIXTURE=(file://[^\s]+)
        command:
          - bash
          - -c
          - 'set -euo pipefail

            root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"

            fixture="$root/tests/fixtures/smoke/gate.html"

            [ -f "$fixture" ]

            echo "FIXTURE=file://$fixture"

            '
      - name: load_fixture
        type: ui
        action: goto
        value: ${state.fixture_url}
        needs:
          - fixture_url
      - name: assert_heading
        type: ui
        action: expect_text
        selector: '#gate'
        value: Manifest smoke gate
        needs:
          - fixture_url
  - id: gemini-hooks-merge-idempotent
    title: merge_settings_hooks is idempotent on a second run (no duplicate hooks)
    tier: Full+Extra
    steps:
      - name: hooks_idempotent
        type: cli
        expect_exit: 0
        captures:
          result: RESULT hooks_idempotent=(ok)
        command:
          - bash
          - -c
          - 'set -euo pipefail

            root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"

            sb="$(mktemp -d)"; trap ''rm -rf "$sb"'' EXIT

            SRC="$sb/src.json" TGT="$sb/tgt.json"

            printf ''{"hooks":{"BeforeAgent":[{"hooks":[{"name":"token-economy-reminder","type":"command","command":"echo
            reminder","timeout":5000}]}]}}'' > "$SRC"

            printf ''{}'' > "$TGT"

            command_exists() { command -v "$1" >/dev/null 2>&1; }

            print_info() { :; }

            print_success() { :; }

            print_warning() { :; }

            source "$root/bootstrap/lib/deploy.sh"

            merge_settings_hooks "$SRC" "$TGT" > /dev/null

            merge_settings_hooks "$SRC" "$TGT" > /dev/null

            python3 - "$TGT" <<''INNER''

            import json, sys

            d = json.load(open(sys.argv[1]))

            assert len(d["hooks"]["BeforeAgent"]) == 1, d

            INNER

            echo "RESULT hooks_idempotent=ok"

            '
  - id: apm-ownership-single-owner
    title: apm_ownership_report.sh reports one owner, and can detect when it is zero
    tier: Lite
    steps:
      - name: apm_ownership_gate
        type: cli
        expect_exit: 0
        command:
          - bash
          - -c
          - "set -euo pipefail\nroot=\"$(git rev-parse --show-toplevel 2>/dev/null\
            \ || pwd)\"\nsb=\"$(mktemp -d)\"; trap 'rm -rf \"$sb\"' EXIT\nmkdir -p\
            \ \"$sb/home/.claude/skills\"\nprintf 'domains: []\\n' > \"$sb/d.yml\"\
            \nHOME=\"$sb/home\" MANIFEST_APM_DOMAINS=\"$sb/d.yml\" APM_LOCKFILE=\"\
            $sb/absent.yml\" \\\n  \"$root/configs/claude/scripts/apm_ownership_report.sh\"\
            \nprintf 'domains:\\n  - skills\\n' > \"$sb/d.yml\"\nif HOME=\"$sb/home\"\
            \ MANIFEST_APM_DOMAINS=\"$sb/d.yml\" APM_LOCKFILE=\"$sb/absent.yml\" \\\
            \n     \"$root/configs/claude/scripts/apm_ownership_report.sh\" > /dev/null;\
            \ then\n  echo 'ownership gate missed an unowned domain' >&2; exit 1\n\
            fi\necho 'apm ownership gate verified'\n"
  - id: delegate-foreground-envelope
    title: delegate.py task --wait relays a stub backend's result envelope and exits
      0
    tier: Lite
    steps:
      - name: delegate_foreground
        type: cli
        expect_exit: 0
        command:
          - bash
          - -c
          - "set -euo pipefail\nroot=\"$(git rev-parse --show-toplevel 2>/dev/null\
            \ || pwd)\"\nsb=\"$(mktemp -d)\"; trap 'rm -rf \"$sb\"' EXIT\nmkdir -p\
            \ \"$sb/bin\" \"$sb/jobs\"\ncat > \"$sb/bin/stub-backend\" <<'EOS'\n#!/usr/bin/env\
            \ bash\ncat <<'JSON'\n```json\n{\"backend\": \"stub\", \"model\": \"stub-tier\"\
            , \"outcome\": \"success\", \"attempted\": \"noop\", \"changes\": [],\
            \ \"succeeded\": [\"noop\"], \"failed\": [], \"follow_ups\": []}\n```\n\
            JSON\nEOS\nchmod +x \"$sb/bin/stub-backend\"\npython3 - \"$sb\" <<'PYEOF'\n\
            import json, sys\nsb = sys.argv[1]\nd = json.load(open(\"plugins/manifest-delegate/config/backends.json\"\
            ))\ncodex = next(b for b in d[\"backends\"] if b[\"id\"] == \"codex\"\
            )\nstub = dict(codex)\nstub[\"id\"] = \"stub\"; stub[\"aliases\"] = []\n\
            stub[\"binary\"] = f\"{sb}/bin/stub-backend\"\nstub[\"invoke\"] = [f\"\
            {sb}/bin/stub-backend\"]\nstub[\"resume\"] = [f\"{sb}/bin/stub-backend\"\
            ]\nstub[\"readiness\"] = {\"version_cmd\": [f\"{sb}/bin/stub-backend\"\
            ], \"auth_probe_cmd\": [f\"{sb}/bin/stub-backend\"], \"install_fix\":\
            \ \"n/a\", \"login_fix\": \"n/a\", \"retired_check\": None}\nout = {\"\
            $schema\": d[\"$schema\"], \"backends\": [stub]}\njson.dump(out, open(f\"\
            {sb}/backends.json\", \"w\"))\nPYEOF\nMANIFEST_DELEGATE_REGISTRY_PATH=\"\
            $sb/backends.json\" MANIFEST_DELEGATIONS_DIR=\"$sb/jobs\" \\\n  python3\
            \ \"$root/plugins/manifest-delegate/scripts/delegate.py\" task 'smoke\
            \ task' --backend stub --wait \\\n  | grep -q 'outcome: success'\necho\
            \ 'delegate foreground envelope verified'\n"
  - id: delegate-background-job-chain
    title: delegate.py task --background chains through status --wait, result, and
      cancel-on-completed (Constitution VI)
    tier: Lite
    steps:
      - name: delegate_background_chain
        type: cli
        expect_exit: 0
        command:
          - bash
          - -c
          - 'set -euo pipefail

            root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"

            sb="$(mktemp -d)"; trap ''rm -rf "$sb"'' EXIT

            mkdir -p "$sb/bin" "$sb/jobs"

            cat > "$sb/bin/stub-backend" <<''EOS''

            #!/usr/bin/env bash

            sleep 0.2

            cat <<''JSON''

            ```json

            {"backend": "stub", "model": "stub-tier", "outcome": "success", "attempted":
            "noop", "changes": [], "succeeded": ["noop"], "failed": [], "follow_ups":
            []}

            ```

            JSON

            EOS

            chmod +x "$sb/bin/stub-backend"

            python3 - "$sb" <<''PYEOF''

            import json, sys

            sb = sys.argv[1]

            d = json.load(open("plugins/manifest-delegate/config/backends.json"))

            codex = next(b for b in d["backends"] if b["id"] == "codex")

            stub = dict(codex)

            stub["id"] = "stub"; stub["aliases"] = []

            stub["binary"] = f"{sb}/bin/stub-backend"

            stub["invoke"] = [f"{sb}/bin/stub-backend"]

            stub["resume"] = [f"{sb}/bin/stub-backend"]

            stub["readiness"] = {"version_cmd": [f"{sb}/bin/stub-backend"], "auth_probe_cmd":
            [f"{sb}/bin/stub-backend"], "install_fix": "n/a", "login_fix": "n/a",
            "retired_check": None}

            out = {"$schema": d["$schema"], "backends": [stub]}

            json.dump(out, open(f"{sb}/backends.json", "w"))

            PYEOF

            export MANIFEST_DELEGATE_REGISTRY_PATH="$sb/backends.json" MANIFEST_DELEGATIONS_DIR="$sb/jobs"

            out=$(python3 "$root/plugins/manifest-delegate/scripts/delegate.py" task
            ''smoke bg task'' --backend stub --background 2>&1)

            job_id=$(echo "$out" | grep -oE ''^job_id: .*'' | awk ''{print $2}'')

            test -n "$job_id"

            python3 "$root/plugins/manifest-delegate/scripts/delegate.py" status "$job_id"
            --wait --timeout 5 > /dev/null

            python3 "$root/plugins/manifest-delegate/scripts/delegate.py" result "$job_id"
            | grep -q ''outcome: success''

            cancel_out=$(python3 "$root/plugins/manifest-delegate/scripts/delegate.py"
            cancel "$job_id")

            echo "$cancel_out" | grep -q ''already terminal, no-op''

            echo ''delegate background chain verified''

