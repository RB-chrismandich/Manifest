  - id: delegate-second-opinion-attribution
    title: delegate.py task --second-opinion attributes both the original and second-opinion backend
    tier: Lite
    steps:
      - name: second_opinion_attribution
        type: cli
        expect_exit: 0
        command:
          - bash
          - -c
          - |
            set -euo pipefail
            root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
            sb="$(mktemp -d)"; trap 'rm -rf "$sb"' EXIT
            mkdir -p "$sb/bin" "$sb/jobs"
            make_stub() {
              cat > "$sb/bin/$1" <<EOS
            #!/usr/bin/env bash
            cat <<JSON
            \\\`\\\`\\\`json
            {"backend": "$1", "model": "stub-tier", "outcome": "success", "attempted": "noop", "changes": [], "succeeded": ["noop"], "failed": [], "follow_ups": []}
            \\\`\\\`\\\`
            JSON
            EOS
              chmod +x "$sb/bin/$1"
            }
            make_stub stub-a
            make_stub stub-b
            python3 - "$sb" <<'PYEOF'
            import json, sys
            sb = sys.argv[1]
            d = json.load(open("plugins/manifest-delegate/config/backends.json"))
            codex = next(b for b in d["backends"] if b["id"] == "codex")
            backends = []
            for name in ("stub-a", "stub-b"):
                stub = dict(codex)
                stub["id"] = name
                stub["aliases"] = []
                stub["binary"] = f"{sb}/bin/{name}"
                stub["invoke"] = [f"{sb}/bin/{name}"]
                stub["resume"] = [f"{sb}/bin/{name}"]
                stub["readiness"] = {
                    "version_cmd": [f"{sb}/bin/{name}"],
                    "auth_probe_cmd": [f"{sb}/bin/{name}"],
                    "install_fix": "n/a",
                    "login_fix": "n/a",
                    "retired_check": None,
                }
                backends.append(stub)
            out = {"$schema": d["$schema"], "backends": backends}
            json.dump(out, open(f"{sb}/backends.json", "w"))
            PYEOF
            export MANIFEST_DELEGATE_REGISTRY_PATH="$sb/backends.json" MANIFEST_DELEGATIONS_DIR="$sb/jobs"
            out=$(python3 "$root/plugins/manifest-delegate/scripts/delegate.py" task 'original task' --backend stub-a --wait)
            job_id=$(echo "$out" | grep -oE '^job_id: .*' | awk '{print $2}')
            test -n "$job_id"
            so_out=$(python3 "$root/plugins/manifest-delegate/scripts/delegate.py" task --second-opinion --of "$job_id" --backend stub-b --wait)
            echo "$so_out" | grep -q 'backend: stub-b'
