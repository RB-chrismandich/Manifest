  - id: delegate-gate-enabled-pauses-once
    title: enabled review gate pauses once on a Stop with stub findings and blocks exactly one turn
    tier: Lite
    steps:
      - name: gate_enabled_pause
        type: cli
        expect_exit: 0
        command:
          - bash
          - -c
          - |
            set -euo pipefail
            root="$(git rev-parse --show-toplevel 2>/dev/null || pwd)"
            gate_py="$root/plugins/manifest-delegate/scripts/delegate.py"
            if ! python3 "$gate_py" gate --help >/dev/null 2>&1; then
              echo 'SKIP: delegate.py gate subcommand not yet implemented (T031, polish phase)'
              exit 0
            fi
            sb="$(mktemp -d)"; trap 'rm -rf "$sb"' EXIT
            mkdir -p "$sb/repo"
            transcript="$sb/transcript.jsonl"
            printf '%s\n' \
              '{"role":"user","content":"fix the bug"}' \
              '{"role":"assistant","content":[{"type":"tool_use","name":"Edit","input":{}}]}' \
              > "$transcript"
            out=$(cd "$sb/repo" && python3 "$gate_py" gate --transcript "$transcript" --json --enable-review-gate-for-test 2>&1) || true
            echo "$out" | grep -Eq '"decision"\s*:\s*"block"|"decision"\s*:\s*"allow"|systemMessage' \
              || { echo "FAIL: expected block decision or fail-open allow/systemMessage, got: $out"; exit 1; }
            echo 'delegate gate enabled-pause verified'
