# Pre-commit hooks for Manifest project
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(\.Jules/|docs/templates/)
      - id: end-of-file-fixer
        exclude: ^(\.Jules/|docs/templates/)
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^(\.Jules/)
      - id: check-json
        exclude: ^(\.Jules/)
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Shell script checking
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: ['--severity=warning']
        exclude: ^(\.Jules/)

  # Shell script formatting
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.7.0-4
    hooks:
      - id: shfmt
        args: ['-i', '4', '-ci', '-sr', '-w']
        exclude: ^(\.Jules/)

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.39.0
    hooks:
      - id: markdownlint
        args: ['--fix', '--config', '.markdownlint.jsonc']
        exclude: ^(\.Jules/|docs/templates/|docs/SHELL_ANALYSIS_REPORT\.md|docs/VALIDATION_REPORT\.md)

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        exclude: ^(\.Jules/)

  # Python linting + formatting (Ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ['--fix']
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Go linting (golangci-lint)
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.63.4
    hooks:
      - id: golangci-lint
        types_or: [go]

  # JavaScript/TypeScript linting (ESLint)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.18.0
    hooks:
      - id: eslint
        types_or: [javascript, jsx, ts, tsx]
        exclude: ^(templates/|\.Jules/)
        additional_dependencies:
          - eslint@9.18.0

  # Terraform linting + security
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.3
    hooks:
      - id: terraform_tflint
        types_or: [terraform]
      - id: terraform_tfsec
        types_or: [terraform]

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # Custom checks
  - repo: local
    hooks:
      # Validate bootstrap.sh syntax
      - id: validate-bootstrap
        name: Validate bootstrap.sh syntax
        entry: bash -n
        language: system
        files: ^bootstrap\.sh$

      # Check for hardcoded credentials
      - id: check-credentials
        name: Check for hardcoded credentials
        entry: >-
          bash -c 'if grep -rn "sk-[a-zA-Z0-9]\{32,\}"
          --include="*.sh" --include="*.md"
          --include="*.yaml" --include="*.json" .;
          then exit 1; fi'
        language: system
        pass_filenames: false

      # Validate YAML config files
      - id: validate-yaml-configs
        name: Validate YAML config files
        entry: python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]"
        language: system
        files: ^configs/claude/config/.*\.yml$

      # Detect stale repo-relative .claude/ paths after configs/ migration
      # Only scans docs and root markdown — configs/, tests/, and templates/
      # legitimately reference deployed ~/.claude/ paths.
      - id: check-stale-repo-paths
        name: Check for stale repo-relative paths
        entry: >-
          bash -c '
          found=0;
          for f in "$@"; do
          out=$(grep -nE "\.claude/(scripts|config|commands|prompts|skills|\.plans)/" "$f"
          | grep -vE "~/\.claude/" | grep -vE "configs/claude/"
          | grep -vE "\\\$HOME/\.claude/" | grep -vE "\\$\\{HOME\\}/\.claude/" || true);
          if [ -n "$out" ]; then
          echo "Stale repo path in $f:"; echo "$out"; found=1;
          fi; done;
          exit $found' --
        language: system
        types: [markdown]
        exclude: ^(\.pre-commit-config\.yaml|\.Jules/|configs/|tests/|\.claude/|docs/templates/)

# Global settings
default_language_version:
  python: python3

exclude: ^(\.Jules/|\.git/|\.agent_outputs/|node_modules/)
