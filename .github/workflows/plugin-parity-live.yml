name: Manifest Plugin Live Parity

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: plugin-parity-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parity:
    name: Live ${{ matrix.harness }} parity
    runs-on: ubuntu-latest
    environment: manifest-plugin-live
    strategy:
      fail-fast: false
      matrix:
        harness: [claude, codex, gemini, cursor, antigravity, devin]
    env:
      HARNESS: ${{ matrix.harness }}
      # This protected environment secret is intentionally required. A public
      # PR runner cannot manufacture a licensed/authenticated native CLI and
      # must report BLOCKED rather than passing a fake live result.
      MANIFEST_LIVE_SETUP_COMMAND: ${{ secrets.MANIFEST_LIVE_SETUP_COMMAND }}
      MANIFEST_LIVE_HARNESS_TOKEN: ${{ secrets.MANIFEST_LIVE_HARNESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Require licensed native harness setup
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MANIFEST_LIVE_HARNESS_TOKEN:-}" || -z "${MANIFEST_LIVE_SETUP_COMMAND:-}" ]]; then
            echo "BLOCKED: protected MANIFEST_LIVE_HARNESS_TOKEN and MANIFEST_LIVE_SETUP_COMMAND are required"
            exit 1
          fi
          # The protected release environment owns this audited, harness-specific
          # installer. It must authenticate and put exactly one requested CLI on PATH.
          bash -lc "$MANIFEST_LIVE_SETUP_COMMAND"
          case "$HARNESS" in
            claude) native=claude ;;
            codex) native=codex ;;
            gemini) native=gemini ;;
            cursor) native=cursor-agent ;;
            antigravity) native=agy ;;
            devin) native=devin ;;
          esac
          command -v "$native" >/dev/null || { echo "BLOCKED: $native is absent after protected setup"; exit 1; }
          "$native" --version

      - name: Build immutable coordinator and release artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist live-release
          uv build
          WHEEL="$(find dist -maxdepth 1 -name 'manifest_agent-*.whl' -print -quit)"
          test -n "$WHEEL"
          ARCHIVE_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          uv run python tools/build_manifest_release.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir live-release \
            --archive-base-url "$ARCHIVE_BASE_URL"
          ARCHIVE="$(find live-release -maxdepth 1 -name 'manifest-plugins-*.tar.gz' -print -quit)"
          METADATA="live-release/manifest-release.json"
          test -n "$ARCHIVE"
          test -f "$METADATA"
          sha256sum "$WHEEL" "$ARCHIVE" "$METADATA" | tee release-checksums.txt
          printf 'WHEEL=%s\n' "$WHEEL" >> "$GITHUB_ENV"

      - name: Verify immutable release metadata
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find live-release -maxdepth 1 -name 'manifest-plugins-*.tar.gz' -print -quit)"
          METADATA="live-release/manifest-release.json"
          ARCHIVE_BASE_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          python3 - "$ARCHIVE" "$METADATA" "$GITHUB_SHA" "$ARCHIVE_BASE_URL" <<'PY'
          import hashlib
          import json
          import re
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          DOMAIN_BUNDLES = (
              "manifest-code-quality",
              "manifest-docs",
              "manifest-forge",
              "manifest-ops",
              "manifest-security",
              "manifest-spec-planning",
              "manifest-workspace",
              "stitch-design",
          )
          TOP_LEVEL_KEYS = {
              "archive_sha256",
              "archive_url",
              "bundles",
              "commit",
              "files",
              "minimum_adapter_versions",
              "schema_version",
              "version",
          }
          BUNDLE_KEYS = {"contract_schema_version", "sha256", "version"}
          FILE_KEYS = {"mode", "sha256", "size"}
          ADAPTERS = {"antigravity", "claude", "codex", "cursor", "devin", "gemini"}
          COMMIT = re.compile(r"^[0-9a-f]{40}$")
          SHA256 = re.compile(r"^[0-9a-f]{64}$")
          VERSION = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$")

          def fail(message):
              raise SystemExit(f"release verification failed: {message}")

          def require(condition, message):
              if not condition:
                  fail(message)

          def checksum(data):
              return hashlib.sha256(data).hexdigest()

          def bundle_checksum(name, files):
              digest = hashlib.sha256()
              prefix = f"plugins/{name}/"
              paths = sorted(path for path in files if path.startswith(prefix))
              require(paths, f"{name} has no indexed files")
              for path in paths:
                  record = files[path]
                  relative = path.removeprefix(prefix).encode("utf-8")
                  digest.update(len(relative).to_bytes(8, "big"))
                  digest.update(relative)
                  digest.update(int(record["mode"], 8).to_bytes(2, "big"))
                  digest.update(record["size"].to_bytes(8, "big"))
                  digest.update(bytes.fromhex(record["sha256"]))
              return digest.hexdigest()

          def canonical_marketplace(version):
              entries = (
                  ("manifest-code-quality", "code-quality", "Code analysis, refactoring, verification, and test-quality workflows."),
                  ("manifest-docs", "documentation", "Documentation improvement, diagram generation, and doc-set orchestration."),
                  ("manifest-forge", "version-control", "Git forge, issue tracking, pull request, and release lifecycle workflows."),
                  ("manifest-ops", "deployment", "CI, deployment, configuration, container, and runtime operations workflows."),
                  ("manifest-security", "security", "Security review, threat analysis, hardening, and finding-triage workflows."),
                  ("manifest-spec-planning", "project-management", "Specification, planning, trade-off, and implementation-loop workflows."),
                  ("manifest-workspace", "productivity", "Workspace configuration, environment, session, and learning workflows."),
                  ("stitch-design", "design", "Design generation, review, extraction, and implementation workflows."),
              )
              return {
                  "description": "Manifest agent capabilities partitioned into eight portable domain bundles.",
                  "name": "manifest",
                  "owner": {"name": "ReefBytes"},
                  "plugins": [
                      {
                          "category": category,
                          "description": description,
                          "name": name,
                          "source": f"./plugins/{name}",
                          "version": version,
                      }
                      for name, category, description in entries
                  ],
              }

          require(len(sys.argv) == 5, "unexpected verifier arguments")
          archive = Path(sys.argv[1])
          metadata_path = Path(sys.argv[2])
          commit = sys.argv[3]
          base_url = sys.argv[4]
          require(archive.is_file() and metadata_path.is_file(), "release files are missing")
          try:
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          except (OSError, ValueError) as error:
              fail(f"metadata is unreadable: {error}")
          require(isinstance(metadata, dict), "metadata is not an object")
          require(set(metadata) == TOP_LEVEL_KEYS, "metadata keys are not strict")
          version = metadata["version"]
          require(isinstance(version, str) and VERSION.fullmatch(version), "release version is invalid")
          require(metadata["schema_version"] == 1 and not isinstance(metadata["schema_version"], bool), "release schema version is invalid")
          require(isinstance(metadata["commit"], str) and COMMIT.fullmatch(metadata["commit"]) is not None and metadata["commit"] == commit, "release commit differs from workflow commit")
          require(isinstance(metadata["archive_sha256"], str) and SHA256.fullmatch(metadata["archive_sha256"]) is not None, "release archive checksum is invalid")
          require(metadata["archive_sha256"] == checksum(archive.read_bytes()), "release archive checksum does not match metadata")
          require(archive.name == f"manifest-plugins-{version}.tar.gz", "release archive filename is invalid")
          expected_url = f"{base_url}/{metadata['version']}/{archive.name}"
          require(metadata["archive_url"] == expected_url, "release archive URL does not match workflow base")

          adapters = metadata["minimum_adapter_versions"]
          require(isinstance(adapters, dict) and set(adapters) == ADAPTERS, "adapter version map is invalid")
          require(all(isinstance(value, str) and value for value in adapters.values()), "adapter version map is invalid")
          bundles = metadata["bundles"]
          require(isinstance(bundles, dict) and tuple(bundles) == DOMAIN_BUNDLES, "bundle set is invalid")
          files = metadata["files"]
          require(isinstance(files, dict) and files, "file index is invalid")
          for path, record in files.items():
              parsed = PurePosixPath(path) if isinstance(path, str) else None
              require(parsed is not None and parsed.as_posix() == path and not parsed.is_absolute() and ".." not in parsed.parts, "file index path is unsafe")
              allowed = path == ".claude-plugin/marketplace.json" or any(path.startswith(f"plugins/{name}/") for name in DOMAIN_BUNDLES)
              require(allowed, f"file index path is outside domain bundles: {path}")
              require(isinstance(record, dict) and set(record) == FILE_KEYS, f"file index record is invalid: {path}")
              require(isinstance(record["mode"], str) and record["mode"] in {"0644", "0755"}, f"file mode is invalid: {path}")
              require(isinstance(record["size"], int) and not isinstance(record["size"], bool) and record["size"] >= 0, f"file size is invalid: {path}")
              require(isinstance(record["sha256"], str) and SHA256.fullmatch(record["sha256"]) is not None, f"file checksum is invalid: {path}")

          observed = {}
          prefix = f"manifest-plugins-{version}/"
          try:
              with tarfile.open(archive, mode="r:gz") as release:
                  member_names = []
                  for member in release.getmembers():
                      member_path = PurePosixPath(member.name)
                      require(member.name.startswith(prefix) and member_path.as_posix() == member.name and not member_path.is_absolute() and ".." not in member_path.parts, "archive member path is unsafe")
                      path = member.name.removeprefix(prefix)
                      require(path and path not in observed, "archive has duplicate member")
                      require(path in files, f"archive has unlisted member: {path}")
                      require(member.isfile() and not member.issym() and not member.islnk() and not member.isdev(), f"archive member type is invalid: {path}")
                      record = files[path]
                      require(member.mode == int(record["mode"], 8), f"archive member mode differs: {path}")
                      require(member.size == record["size"] and member.mtime == 0 and member.uid == 0 and member.gid == 0 and member.uname == "" and member.gname == "", f"archive member metadata differs: {path}")
                      payload = release.extractfile(member)
                      require(payload is not None, f"archive member is unreadable: {path}")
                      data = payload.read()
                      require(checksum(data) == record["sha256"], f"archive member checksum differs: {path}")
                      observed[path] = data
                      member_names.append(member.name)
          except (OSError, tarfile.TarError) as error:
              fail(f"archive is unreadable: {error}")
          require(member_names == sorted(member_names), "archive members are not deterministic")
          require(set(observed) == set(files), "archive members do not match file index")
          try:
              marketplace = json.loads(observed[".claude-plugin/marketplace.json"])
          except (KeyError, UnicodeDecodeError, ValueError) as error:
              fail(f"release marketplace is invalid: {error}")
          marketplace_plugins = marketplace.get("plugins") if isinstance(marketplace, dict) else None
          require(isinstance(marketplace_plugins, list) and all(isinstance(plugin, dict) for plugin in marketplace_plugins), "release marketplace bundle set is invalid")
          require(tuple(plugin.get("name") for plugin in marketplace_plugins) == DOMAIN_BUNDLES, "release marketplace bundle set is invalid")
          require(marketplace == canonical_marketplace(version), "release marketplace metadata differs")

          for name in DOMAIN_BUNDLES:
              record = bundles[name]
              require(isinstance(record, dict) and set(record) == BUNDLE_KEYS, f"bundle record is invalid: {name}")
              require(record["version"] == version, f"bundle version differs: {name}")
              require(record["contract_schema_version"] == 1 and not isinstance(record["contract_schema_version"], bool), f"bundle schema differs: {name}")
              require(isinstance(record["sha256"], str) and SHA256.fullmatch(record["sha256"]) is not None, f"bundle checksum is invalid: {name}")
              require(record["sha256"] == bundle_checksum(name, files), f"bundle checksum differs: {name}")
              contract_path = f"plugins/{name}/manifest-capabilities.yml"
              require(contract_path in observed, f"bundle contract is missing: {name}")
              contract = observed[contract_path].decode("utf-8", errors="strict")
              match = re.match(r"^schema_version: ([0-9]+)\nbundle:\n  name: ([^\n]+)\n  version: ([^\n]+)\n", contract)
              require(match is not None and match.group(1) == str(record["contract_schema_version"]) and match.group(2) == name and match.group(3) == version, f"bundle contract differs: {name}")
          PY

      - name: Install, reconcile, and uninstall one native harness
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/manifest-live-home/$HARNESS"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state"
          export XDG_CACHE_HOME="$HOME/.cache"
          mkdir -p "$HOME"
          uvx --from "$WHEEL" manifest install --source "$GITHUB_WORKSPACE" --harness "$HARNESS" --non-interactive --json | tee install.json
          uvx --from "$WHEEL" manifest reconcile --source "$GITHUB_WORKSPACE" --harness "$HARNESS" --json | tee reconcile.json
          python3 - <<'PY'
          import json
          for report_path in ("install.json", "reconcile.json"):
              report = json.load(open(report_path, encoding="utf-8"))
              harness = report["harnesses"].get(__import__("os").environ["HARNESS"])
              if report["state"] != "READY" or harness is None or harness["state"] != "READY":
                  raise SystemExit(f"BLOCKED: {report_path} did not verify READY parity")
          PY
          uvx --from "$WHEEL" manifest uninstall --harness "$HARNESS" --json | tee uninstall.json

      - name: Redact native credential stores before diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report_home="$RUNNER_TEMP/manifest-live-home/$HARNESS"
          if [[ -d "$report_home" ]]; then
            find "$report_home" -type f \( -iname '*token*' -o -iname '*credential*' -o -iname '*secret*' -o -iname '*auth*' \) -delete
          fi

      - name: Upload parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-parity-${{ matrix.harness }}
          path: |
            install.json
            reconcile.json
            uninstall.json
            release-checksums.txt
            live-release/manifest-plugins-*.tar.gz
            live-release/manifest-release.json
            ${{ runner.temp }}/manifest-live-home/${{ matrix.harness }}
          if-no-files-found: warn
