name: Token Benchmark

on:
  workflow_dispatch:
    inputs:
      providers:
        description: >-
          Comma-separated providers to benchmark. Only claude,gemini measure
          tokens/cost; antigravity is quality-only (no token/cost data, no
          system-prompt mechanism) — see docs/TOKEN_BENCHMARK.md legend.
        default: "claude"
        required: false
      mode:
        description: "Benchmark mode"
        type: choice
        options:
          - api-only
          - cli-only
          - api-and-cli
        default: api-only
      conditions:
        description: "Comma-separated conditions: before,after,cached,tiered,compressed"
        default: "before,after,cached,tiered,compressed"
        required: false
      commit_report:
        description: "Commit updated TOKEN_BENCHMARK.md"
        type: boolean
        default: false
  schedule:
    # Weekly on Monday at 08:00 UTC — api-only, claude only
    - cron: "0 8 * * 1"

permissions:
  contents: write  # needed only when commit_report=true; harmless otherwise

jobs:
  benchmark:
    name: Token Benchmark
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements-ci.txt

      - name: Install Python deps
        run: |
          pip install -r tests/requirements-ci.txt
          pip install anthropic google-genai

      # Install claude CLI (used by cli-only and api-and-cli modes).
      # claude accepts ANTHROPIC_API_KEY for headless/CI auth — no OAuth needed.
      - name: Install claude CLI
        if: >
          github.event.inputs.mode == 'cli-only' ||
          github.event.inputs.mode == 'api-and-cli'
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve benchmark flags
        id: flags
        env:
          INPUT_PROVIDERS: ${{ github.event.inputs.providers || 'claude' }}
          INPUT_MODE: ${{ github.event.inputs.mode || 'api-only' }}
          INPUT_CONDITIONS: ${{ github.event.inputs.conditions || 'before,after,cached,tiered,compressed' }}
        run: |
          # Validate providers: only alphanumeric chars and commas
          if ! echo "$INPUT_PROVIDERS" | grep -qE '^[a-zA-Z0-9]([a-zA-Z0-9,]*[a-zA-Z0-9])?$'; then
            echo "Invalid providers value: $INPUT_PROVIDERS"
            exit 1
          fi
          # Validate mode against the allowed enum
          case "$INPUT_MODE" in
            api-only|cli-only|api-and-cli) ;;
            *)
              echo "Invalid mode value: $INPUT_MODE"
              exit 1
              ;;
          esac
          # Validate conditions: comma-separated tokens, no empty entries
          if ! echo "$INPUT_CONDITIONS" | grep -qE '^[a-zA-Z0-9-]+(,[a-zA-Z0-9-]+)*$'; then
            echo "Invalid conditions value: $INPUT_CONDITIONS"
            exit 1
          fi
          echo "providers=$INPUT_PROVIDERS" >> "$GITHUB_OUTPUT"
          echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          echo "conditions=$INPUT_CONDITIONS" >> "$GITHUB_OUTPUT"
          echo "Resolved: providers=$INPUT_PROVIDERS mode=$INPUT_MODE conditions=$INPUT_CONDITIONS"

      - name: Run token benchmark
        env:
          BENCHMARK_PROVIDERS: ${{ steps.flags.outputs.providers }}
          BENCHMARK_MODE: ${{ steps.flags.outputs.mode }}
          BENCHMARK_CONDITIONS: ${{ steps.flags.outputs.conditions }}
        run: |
          ARGS=(--providers "$BENCHMARK_PROVIDERS")
          case "$BENCHMARK_MODE" in
            api-only)    ARGS+=(--api-only) ;;
            cli-only)    ARGS+=(--cli-only) ;;
            api-and-cli) ;;
          esac
          ARGS+=(--conditions "$BENCHMARK_CONDITIONS")
          python3 tests/token_benchmark/harness.py "${ARGS[@]}"

      - name: Upload results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: benchmark-results-${{ github.run_id }}
          path: tests/token_benchmark/results/
          retention-days: 30

      - name: Commit updated TOKEN_BENCHMARK.md
        if: ${{ github.event.inputs.commit_report == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/TOKEN_BENCHMARK.md; then
            echo "No changes to TOKEN_BENCHMARK.md"
          else
            git add docs/TOKEN_BENCHMARK.md tests/token_benchmark/results/
            git commit -m "chore: update token benchmark results [skip ci]"
            git push
          fi
