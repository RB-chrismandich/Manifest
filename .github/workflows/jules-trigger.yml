name: Jules Trigger

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  # write, not read: this workflow fires on issue_comment on a PR, and posts a
  # 👀 reaction + a failure comment on that PR. PR-targeted comment/reaction
  # writes require pull-requests:write — issues:write alone 403s ("Resource not
  # accessible by integration") even though PR comments use the issues API.
  pull-requests: write
  issues: write

concurrency:
  group: jules-${{ github.event.issue.number }}
  cancel-in-progress: false  # let an in-flight Jules run finish; new invocations queue

jobs:
  invoke:
    # Cheap pre-filter only — NOT the security boundary. author_association is
    # set server-side (not spoofable) but is NOT a write-access check: it admits
    # read-only/triage collaborators and read-only org members. The real gate is
    # the "Verify commenter has write access" step below, which fails closed; the
    # `if:` just avoids spinning up the job for unrelated comments.
    if: >-
      contains(github.event.comment.body, '@google-labs-jules') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Verify commenter has write access
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          # Security boundary: only collaborators with write/admin permission may
          # reach the JULES_API_KEY step. Fail closed on a lower level or any API
          # error. (Public repo: the default GITHUB_TOKEN can read this.)
          script: |
            let level = 'none';
            try {
              const res = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.comment.user.login,
              });
              level = res.data.permission;
            } catch (e) {
              core.setFailed(`Cannot verify permission for ${context.payload.comment.user.login}: ${e.message}`);
              return;
            }
            if (level !== 'admin' && level !== 'write') {
              core.setFailed(`${context.payload.comment.user.login} lacks write access (permission: ${level}); refusing to invoke Jules.`);
            }

      - name: Acknowledge with reaction
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Resolve start branch
        id: branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            let ref = 'main';
            if (context.payload.issue.pull_request) {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              const head = pr.data.head.ref;
              // Defense-in-depth: the branch name reaches the invoke step's
              // shell (via env) and the actions/checkout ref. A fork PR's head
              // ref is attacker-controlled and git refs allow shell
              // metacharacters ($ backtick ; | ( )), so reject anything
              // outside a strict allowlist instead of passing it through.
              if (!/^[A-Za-z0-9._\/-]+$/.test(head)) {
                core.setFailed(`Refusing unsafe branch name: ${head}`);
                return;
              }
              ref = head;
            }
            core.setOutput('ref', ref);

      - name: Check out the start branch for prompt context
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ steps.branch.outputs.ref }}
          fetch-depth: 30

      - name: Invoke Jules
        # Inline replacement for google-labs-code/jules-action@bff7875 (v1.0.0),
        # retired for three bugs: (1) its internal ref-less checkout grabbed the
        # DEFAULT branch on issue_comment events, so the prompt context came from
        # main, not the PR under review; (2) its include_last_commit /
        # include_commit_log toggles are string-truthy no-ops ("false" is truthy
        # in composite `if:`), so the full-patch `git show` could not be turned
        # off; (3) it passed the prompt as ONE jq --arg argv element, which hits
        # E2BIG once a commit exceeds the 128KB kernel per-arg cap (main's tip
        # did — run 29124735254). The prompt now travels via jq --rawfile
        # (ARG_MAX-safe) with bounded, branch-correct context, and untrusted
        # values reach the shell only through env (never templated into code).
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          STARTING_BRANCH: ${{ steps.branch.outputs.ref }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          REPO_FULL_NAME: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$COMMENT_BODY" > prompt.txt
          {
            printf '\n\nBranch: %s\n\nRecent commits (oneline):\n```\n' "$STARTING_BRANCH"
            git log --oneline -20
            printf '```\n\nLatest commit (message + diffstat):\n```\n'
            git show --stat
            printf '```\n'
          } >> prompt.txt
          # shellcheck disable=SC2016  # $jules_prompt etc. are jq variables, not shell
          jq -n --rawfile jules_prompt prompt.txt \
            --arg starting_branch "$STARTING_BRANCH" \
            --arg repo_full_name "$REPO_FULL_NAME" '{
              prompt: $jules_prompt,
              sourceContext: {
                source: "sources/github/\($repo_full_name)",
                githubRepoContext: { startingBranch: $starting_branch }
              },
              requirePlanApproval: false,
              automationMode: "AUTO_CREATE_PR"
            }' > jules_payload.json
          http_code=$(curl -sS -o jules_response.json -w '%{http_code}' \
            'https://jules.googleapis.com/v1alpha/sessions' \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Goog-Api-Key: ${JULES_API_KEY}" \
            -d @jules_payload.json)
          if [ "${http_code}" -ge 300 ]; then
            echo "Jules API returned HTTP ${http_code}:" >&2
            cat jules_response.json >&2
            exit 1
          fi
          # Echo the created session minus the (large) prompt for the run log.
          jq -c 'del(.prompt)' jules_response.json

      - name: Report failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `⚠️ The Jules trigger workflow failed — see the [workflow run](${runUrl}).`,
            });
