description = "Verify cross-platform config consistency, symlinks, and detect configuration drift"
prompt = """
# Sync Configs

Use the shared skill workflow as the source of truth.

- Skill path: `~/.gemini/skills/sync-configs/SKILL.md`
- Canonical source: `~/.claude/skills/sync-configs/SKILL.md` (via symlink)

## Execution

1. Load and follow the skill file exactly.
2. Apply `{{args}}` as the command input for that skill.
3. Preserve the skill-defined safety checks, validation rules, and output format.
4. If the skill file is missing, stop and report the missing path.
"""
