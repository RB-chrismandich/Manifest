# Auth Flow — Login and session verification
# Copy to tests/browser/auth-flow.yaml and update credentials/URLs for your project.

task: "Navigate to the login page, enter test credentials (user: test@example.com, password: testpass123), submit the form, and verify the user reaches the authenticated dashboard"
judge_context:
  - "The login page must load with email and password fields"
  - "After submitting valid credentials, the user must be redirected to a dashboard or home page"
  - "The authenticated page must display the user's name or email"
  - "No error messages should appear after successful login"
max_steps: 15
url: "http://localhost:3000/login"
tags: [auth, login, session]
