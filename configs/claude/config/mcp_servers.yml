# Default MCP server registry for Manifest-managed agent environments.
# Shared via symlinks from ~/.claude/config to ~/.cursor/config, ~/.gemini/config, ~/.codex/config.
#
# Adding a new server here is all that's needed — the bootstrap interactive
# prompt (--install-mcp) picks it up automatically with no code changes.
#
# `shipped: true` means "register this by default on every platform". Everything
# else is catalog-only: offered by --install-mcp, absent until asked for. The
# default is deliberately Context7 alone — each remote server is launched via
# `npx mcp-remote`, i.e. one subprocess per agent invocation, and registering
# four of them took local bats runs from ~7 minutes to not finishing (#646).
# Consumers: generate_cursor_mcp.py filters on this key; bootstrap/lib/mcp.sh
# must keep listing ALL entries so --install-mcp stays a full catalog (its awk
# fallback treats any unrecognised key as a server name, so `shipped` is in that
# parser's exclusion list too).

mcp_servers:
  # ── Core (enabled by default in most workflows) ──────────────────────

  sentry:
    url: "https://mcp.sentry.dev/mcp"
    transport: "http"
    oauth: true
    purpose: "Error triage, issue investigation, stack traces, release regressions"

  context7:
    url: "https://mcp.context7.com/mcp/oauth"
    transport: "http"
    oauth: true
    shipped: true
    purpose: "Library/API documentation, setup guides, configuration examples"

  linear:
    url: "https://mcp.linear.app/mcp"
    transport: "http"
    oauth: true
    purpose: "Issue context, project plans, acceptance criteria, team workflows"

  # ── Knowledge & documentation ────────────────────────────────────────

  deepwiki:
    url: "https://mcp.deepwiki.com/mcp"
    transport: "http"
    oauth: false
    purpose: "AI-indexed GitHub repo documentation, dependency lookup, codebase Q&A"

  glean:
    url: "https://developers.glean.com/mcp"
    transport: "http"
    oauth: true
    purpose: "Enterprise knowledge base search, internal docs, people and team context"

  google-dev-docs:
    url: "https://developerknowledge.googleapis.com/mcp"
    transport: "http"
    oauth: false
    purpose: "Official Google developer docs (Firebase, Cloud, Android, Maps)"
    note: "Requires X-Goog-Api-Key header — generate an API key in Google Cloud console"

  # ── Project management & collaboration ───────────────────────────────

  atlassian:
    url: "https://mcp.atlassian.com/v1/mcp"
    transport: "http"
    oauth: true
    purpose: "Jira issues, Confluence pages, Compass components, project workflows"

  # ── Infrastructure as Code ───────────────────────────────────────────

  opentofu:
    url: "https://mcp.opentofu.org/mcp"
    transport: "http"
    oauth: false
    purpose: "OpenTofu registry search, provider/module docs, resource and datasource reference"

  # ── Web scraping & data extraction ───────────────────────────────────

  apify:
    url: "https://mcp.apify.com"
    transport: "http"
    oauth: true
    purpose: "Web scraping, data extraction, 4000+ ready-made crawlers and automation actors"
