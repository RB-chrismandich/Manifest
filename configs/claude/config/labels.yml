# labels.yml - Canonical label registry for issue management
#
# Single source of truth for labels used across GitHub, GitLab, and Linear.
# Run `label_sync.sh` to ensure all labels exist in each platform.
#
# Color format: 6-digit hex without leading '#'

labels:
  - name: planned
    color: "1D76DB"
    description: "Implementation plan exists for this issue"
    platforms: [github, gitlab, linear]

  - name: in-progress
    color: "FBCA04"
    description: "Implementation is actively underway"
    platforms: [github, gitlab, linear]

  - name: needs-review
    color: "E3A21A"
    description: "Requires human review before completion"
    platforms: [github, gitlab, linear]

  - name: done
    color: "0E8A16"
    description: "Implementation complete and validated"
    platforms: [github, gitlab, linear]

  - name: follow-up
    color: "D4C5F9"
    description: "Spawned from another issue during implementation"
    platforms: [github, gitlab, linear]

  - name: future
    color: "C2E0C6"
    description: "Queued for future prioritization and scheduling"
    platforms: [github, gitlab, linear]

  - name: auto-dev
    color: "5319E7"
    description: "Eligible for the autonomous issue developer (/issue-dev-auto)"
    platforms: [github, gitlab, linear]

  - name: needs-human
    color: "B60205"
    description: "Auto-dev could not complete; needs a human"
    platforms: [github, gitlab, linear]

  - name: blocked-dependency
    color: "6A737D"
    description: "Has an unmet dependency; excluded from the auto-dev loop until the blocker merges"
    platforms: [github, gitlab, linear]

  - name: ready-to-merge
    color: "0E8A16"
    description: "Auto-dev verified the PR but lacked merge authority; ready for a human to merge"
    platforms: [github, gitlab]

  - name: loop-active
    color: "FBCA04"
    description: "Transient lock — the auto-dev merge loop is acting on this PR"
    platforms: [github, gitlab]

  - name: hold
    color: "D93F0B"
    description: "Do not auto-merge; the loop must route this PR to a human"
    platforms: [github, gitlab]

deprecated:
  - name: processed
    replacement: done
    reason: "Redundant with 'done' — same color and purpose"
