# Parallel Agent Configuration
# Location: ~/.claude/config/parallel_agent.yml

# Authentication
# ──────────────────────────────────────────────────────────────────
# Claude (Anthropic): API key only
#   export ANTHROPIC_API_KEY="sk-ant-..."
#
# Gemini (Google): OAuth (recommended) or API key
#   OAuth: gemini auth login  (recommended - auto-refreshes)
#   OR:    gcloud auth application-default login
#   OR:    export GOOGLE_API_KEY="..."
#
# Cursor: Uses cursor CLI authentication (whatever cursor is configured with)

# Rate limiting configuration (requests per minute)
rate_limits:
  claude:
    requests_per_minute: 60
    tokens_per_minute: 160000
    burst_size: 5
  gemini:
    requests_per_minute: 30
    tokens_per_minute: 32000
    burst_size: 3
  cursor:
    requests_per_minute: 100
    burst_size: 10
  codex:
    requests_per_minute: 100
    burst_size: 10
  antigravity:
    requests_per_minute: 100
    burst_size: 10
  devin:
    requests_per_minute: 100
    burst_size: 10

# Model tier mappings
#
# Each pin is either VERIFIED (a real one-shot call through the provider's own
# CLI answered on the date noted) or explicitly marked UNVERIFIED. Nothing here
# is transcribed from a documentation page: doc-sourced IDs are what produced
# the 404ing gemini tiers this file used to ship. Re-check with
# `model_check.sh`; add MODEL_CHECK_PROBE=1 on OAuth-only machines, where no
# listing endpoint exists and a live probe is the only proof.
model_tiers:
  # VERIFIED 2026-07-29 — `claude --model <id> -p` on an OAuth (claude.ai max)
  # login; each call's modelUsage.canonicalModel in --output-format json echoed
  # the pinned string exactly. Full IDs rather than the aliases (opus/sonnet/
  # haiku), which also answer: an alias is a moving target the provider can
  # remap, so pinning it would let a tier change model without a diff here.
  # 2026-08-17: the fable tier was retired; sonnet and opus now pin their
  # 1M-context variants, so every Claude tier above haiku is a 1M pin.
  claude:
    haiku: "claude-haiku-4-5"
    sonnet: "claude-sonnet-5[1m]"
    opus: "claude-opus-5[1m]"
  # UNVERIFIED — retained only so tier lookups resolve to something.
  # Measured 2026-07-29: the gemini CLI is non-functional on this account. Every
  # invocation dies at the eligibility layer, before model selection, with
  # IneligibleTierError ("no longer supported for Gemini Code Assist for
  # individuals ... migrate to the Antigravity suite", tierId free-tier), and
  # neither GOOGLE_API_KEY nor GEMINI_API_KEY is set, so the REST models
  # endpoint cannot confirm these IDs either. Google's own stated remedy is the
  # antigravity block below, which serves Gemini models and IS verified. Treat
  # these two as unproven until a probe passes. Confirmed 2026-08-02: Google
  # retired the Gemini CLI on 2026-06-18 in favor of Antigravity CLI (agy), so
  # this block will likely never re-verify on this account; it stays only so
  # tier lookups resolve.
  gemini:
    flash: "gemini-3-flash-preview"
    pro: "gemini-3-pro-preview"
  # VERIFIED 2026-07-29 — `cursor-agent --model <slug> -p` answered for all
  # three. Replaces "auto" in all three tiers, which made the tier abstraction
  # inert for cursor (every role resolved to the same model). One effort ladder
  # from a single family, so the tiers genuinely differ.
  # Deliberately NOT the newer premium ladder (claude-opus-5-thinking-*,
  # gpt-5.6-sol-*, kimi-k3-high, gpt-5.3-codex-*):
  # every one of those returned an account-level ActionRequiredError usage limit
  # (resets 2026-08-12), so they are unverifiable this cycle — NOT confirmed
  # broken. Re-probed 2026-08-02 with catalog-exact slugs
  # (claude-opus-5-thinking-high, gpt-5.6-sol-high, kimi-k3-high): still the
  # same usage-limit error, and the catalog rejection shows premium slugs
  # REQUIRE an effort suffix (bare claude-opus-5-thinking is not a model).
  # Re-probe after 2026-08-12 and promote `advanced` if they answer.
  # `auto` and `composer-2.5` also proved served and remain valid alternates.
  cursor:
    mini: "cursor-grok-4.5-low"
    flash: "cursor-grok-4.5-medium"
    advanced: "cursor-grok-4.5-high"
  # VERIFIED 2026-08-02 — `codex exec --skip-git-repo-check --model <id>` on a
  # ChatGPT login answered for all three. (2026-07-29 these were unverifiable:
  # "Not logged in"; the account has since logged in.) GPT-5.6 family tiers:
  # sol = flagship, terra = mid, luna = fastest/cheapest. Replaces
  # gpt-5.4-mini/gpt-5.4/gpt-5.5: gpt-5.4 and gpt-5.4-mini retire from
  # ChatGPT-login Codex on 2026-08-31 (developers.openai.com/codex/changelog),
  # so the old pins carried a hard expiry.
  codex:
    mini: "gpt-5.6-luna"
    flash: "gpt-5.6-terra"
    advanced: "gpt-5.6-sol"
  # VERIFIED 2026-07-29 — `agy --model <slug> --print` answered for all three
  # (agy 1.1.8).
  # FORMAT MIGRATION: `agy models` now emits slugs (gemini-3.6-flash-low), where
  # on 2026-07-11 (agy 1.1.1) it emitted display labels ("Gemini 3.5 Flash
  # (Low)"). agy still ACCEPTS the old labels — re-probed, they answer — so the
  # previous pins were never broken at runtime; they had silently stopped
  # matching the catalog, which makes model_check.sh score them STALE for a
  # cosmetic reason. Slugs match the catalog and keep that check honest.
  # mini/flash keep the prior low/high effort split, moved to the 3.6 flash
  # family now that it exists. `advanced` is the same model as before in slug
  # form — spec_review.sh reads this exact pin for its agy reviewer, so the
  # reviewer's capability is unchanged.
  # Re-confirmed 2026-08-02: `agy models` still lists all three pins verbatim;
  # gemini-3.6-flash remains the newest family in the agy catalog.
  antigravity:
    mini: "gemini-3.6-flash-low"
    flash: "gemini-3.6-flash-high"
    advanced: "claude-opus-4-6-thinking"
# devin has NO tier block on purpose. `devin models list` is login-gated, so
# this repo cannot enumerate the account's real catalog, and pinning names
# copied off a doc page is exactly how the gemini tiers ended up 404-ing.
# Re-measured 2026-07-29 and the decision stands: `devin models list` returns
# "Error: Not logged in." (exit 1), and `devin auth status` prints "Not logged
# in." while still exiting 0 — so an exit code cannot be used to detect auth
# here. Worse, a one-shot probe is not a safe substitute: `devin --model X -p
# ...` while logged out LAUNCHES an interactive login flow rather than failing,
# which is why model_check.sh refuses to probe devin at all. To pin real tiers:
# `devin auth login`, then `devin models list`, then add a block here.
# With no block, CLIAgent passes --devin-model through verbatim, so a user
# can name a real model (`--devin-model opus`) while the default tier "auto"
# sends no --model at all and the account default stands. Add a block here
# only once `devin models list` has printed the IDs on a logged-in machine.

# Portable ordered fallback policy. Concrete IDs remain exclusively in
# model_tiers; skills may override these tier chains without embedding IDs.
model_fallback:
  mode: confirm
  chains:
    codex: [advanced, flash, mini, auto]
    gemini: [pro, flash, auto]
    antigravity: [advanced, flash, mini, auto]
    cursor: [advanced, flash, mini, auto]

# Timeout configuration (seconds)
timeouts:
  default: 120
  review: 600
  analyze: 900
  improve: 300

# Output configuration
output:
  directory: "~/.claude/.agent_outputs"
  keep_last: 50  # Auto-cleanup: prune all files of runs older than the newest 50

# Validation thresholds
validation:
  consensus_threshold:
    high: 0.80
    medium: 0.50
    low: 0.30

# Credit fallback configuration
# Fallback chains are ordered most→least expensive; on credit exhaustion an agent falls to the
# next-cheaper tier after its starting tier (never up-chain).
credit_fallback:
  claude:
    - opus
    - sonnet
    - haiku
  cursor:
    - advanced
    - flash
    - mini
  gemini:
    - pro
    - flash
  codex:
    - advanced
    - flash
    - mini
  antigravity:
    - advanced
    - flash
    - mini
  # Empty by design: a downgrade chain needs known cheaper tiers, and devin's
  # catalog is not enumerable here (see model_tiers). An empty chain means no
  # fallback attempt rather than a retry against invented tier names.
  devin: []

# CLI agent command definitions (consumed by CLIAgent in agents/runners.py).
# base_args: always passed. model_args: appended only when a model is resolved
# (dropped atomically for tier "auto" — no dangling flags). {output_file} in
# base_args triggers tempfile creation; output "file_then_stdout" reads it
# with priority file > stdout > stderr-on-error.
# prompt_args: how the prompt is passed (default: trailing positional {prompt}).
# Use when the CLI takes the prompt as the value of a flag (e.g. agy --print).
# skill_prompt_transport/skill_prompt_args: direct `manifest skill-run` uses
# stdin or a 0600 temporary file so its one-MiB task boundary never hits ARG_MAX.
cli_agents:
  # claude/gemini entries back the OAuth CLI fallback: used when the provider
  # SDK or its API key is unavailable but the CLI is installed and logged in.
  claude:
    binary: claude
    base_args: []
    model_args: ["--model", "{model}"]
    prompt_args: ["-p", "{prompt}"]
    skill_prompt_transport: stdin
    skill_prompt_args: ["-p"]
    output: stdout
  gemini:
    binary: gemini
    base_args: []
    model_args: ["-m", "{model}"]
    prompt_args: ["-p", "{prompt}"]
    skill_prompt_transport: stdin
    skill_prompt_args: ["-p", ""]
    output: stdout
  # cursor-agent runs headless via --print; --mode ask keeps it read-only
  # (review/analysis only — never edits files or runs shell, and can't hang on
  # tool-approval prompts). Install: curl https://cursor.com/install -fsS | bash
  cursor:
    binary: cursor-agent
    base_args: ["--print", "--trust", "--output-format", "text", "--mode", "ask"]
    model_args: ["--model", "{model}"]
    prompt_args: ["{prompt}"]
    skill_prompt_transport: stdin
    skill_prompt_args: []
    output: stdout
  codex:
    binary: codex
    base_args: ["exec", "--sandbox", "workspace-write", "--color", "never",
                "--output-last-message", "{output_file}"]
    model_args: ["--model", "{model}"]
    skill_prompt_transport: stdin
    skill_prompt_args: ["-"]
    output: file_then_stdout
  antigravity:
    binary: agy
    base_args: []
    model_args: ["--model", "{model}"]
    prompt_args: ["--print", "{prompt}"]
    # agy discards piped stdin in print mode (no --prompt-file flag exists), so
    # skill-run must pass the prompt inline. An oversized prompt then fails
    # loudly with E2BIG instead of silently running agy against an empty input.
    skill_prompt_transport: argv
    skill_prompt_args: ["--print", "{prompt}"]
    output: stdout
  # devin runs headless via -p/--print. --permission-mode auto (the CLI's own
  # default, pinned here so a user-level config.json cannot silently widen it)
  # auto-approves read-only tools only; edit/exec approvals have no one to
  # answer them in non-interactive mode. Install: brew install --cask devin-cli
  # (or curl -fsSL https://cli.devin.ai/install.sh | bash), then devin auth login.
  # Devin 3000.2.17 exposes --prompt-file FILE; skill-run uses it so large
  # prompts stay out of argv while the ordinary parallel-agent path keeps -p.
  devin:
    binary: devin
    base_args: ["--permission-mode", "auto"]
    model_args: ["--model", "{model}"]
    prompt_args: ["-p", "{prompt}"]
    skill_prompt_transport: file
    skill_prompt_args: ["--prompt-file", "{prompt_file}", "--print"]
    output: stdout

# Logging configuration
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  file: "~/.claude/.agent_outputs/parallel_agent.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Synthesis configuration
synthesis:
  enabled: true  # Auto-trigger on low consensus
  threshold: 0.50  # Trigger when consensus < 50%
  model: "sonnet"
  timeout: 300  # 5 minutes
  backend: auto   # auto | cli | sdk (cli = CLI only; sdk = Anthropic SDK only)
  provider: auto  # auto | antigravity | cursor | gemini | codex | claude | devin | sdk
  # First on PATH wins when provider=auto. Override: SYNTH_PROVIDER or SYNTH_CLI.
  provider_order:
    - antigravity
    - cursor
    - gemini
    - codex
    - claude
    - devin

# Headless CLI seams (CDDL personas, SkillClaw evolve) — inherit provider_order
# from synthesis when omitted.
cddl_invoke:
  provider: auto
skillclaw_evolve:
  provider: auto

# Streaming configuration
streaming:
  enabled: true  # Default: enable streaming
  refresh_rate: 4  # Updates per second
  max_display_chars: 500  # Truncate long outputs in live display
