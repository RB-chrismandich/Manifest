# review_bots.yml — machine reviewers/authors that pr-monitor and pr-triage-bots
# skills watch for or triage. Skills iterate this list; adding/renaming a bot is
# a config change, not a skill edit.
#
# Fields:
#   author_login  GitHub bot account login (case-insensitive "copilot"/"jules"
#                 substring is a safe filter). null when no distinct GitHub
#                 identity exists for this entry — see identified_by instead.
#   role          reviewer (submits PR reviews) | author (opens PRs / pushes commits)
#   invoke        automatic (acts without being summoned) | mention (needs a
#                 trigger comment) | n/a (not directly invoked; see notes)
#   mention       the exact mention string that triggers it (invoke: mention only)
#   identified_by author_login (match the GitHub account) | title_prefix (match
#                 the PR title / branch-name convention instead — used when the
#                 entry has no distinct account)
#   title_prefix  PR-title prefix regex/string used when identified_by: title_prefix
#   branch_prefix branch-name prefix, same purpose as title_prefix (supporting signal)
#   notes         behavioral facts a skill needs (timing, quirks) that don't fit
#                 another field

bots:
  copilot:
    author_login: "copilot-pull-request-reviewer[bot]"
    role: reviewer
    invoke: automatic          # reviews PRs without being summoned
    identified_by: author_login
    notes: >
      Verified 2026-07-17 via `gh api repos/RB-chrismandich/Manifest/pulls/<N>/reviews`
      on PRs #533, #538, #543, #550, #554, #559, #563 — login confirmed
      copilot-pull-request-reviewer[bot], displays as "Copilot" in the UI.
      Reviews land automatically when repo/org settings enable Copilot code
      review; if neither requested-reviewers nor submitted-reviews show it,
      the phase is a no-op (don't try to force it — it's a repo/org setting,
      not something a comment can summon).

  jules:
    author_login: "google-labs-jules[bot]"
    role: reviewer
    invoke: mention            # summoned via mention on a trusted commenter's comment
    mention: "@google-labs-jules"
    identified_by: author_login
    notes: >
      Verified 2026-07-17 via `gh api repos/RB-chrismandich/Manifest/issues/<N>/comments`
      on PRs #580 and #581 — the bot's own "👋 Jules, reporting for duty!" greeting
      comment carries login google-labs-jules[bot]. Not a GitHub-native reviewer:
      requesting it as reviewer/assignee is silently ignored; the only working
      trigger is a comment mention acted on by .github/workflows/jules-trigger.yml,
      gated to author_association OWNER/MEMBER/COLLABORATOR. Jules does not leave
      inline GitHub review comments the way Copilot does — its feedback surfaces as
      PR comments, commits pushed to the PR branch, or a separate linked PR (see the
      palette/bolt entries below, which are Jules acting under its personas).

  palette:
    author_login: null         # UNCONFIRMED as a distinct GitHub identity — see notes
    role: author
    invoke: n/a
    identified_by: title_prefix
    title_prefix: "🎨 Palette:"
    branch_prefix: "palette/"
    notes: >
      Checked 2026-07-17: PRs #535, #539, #540, #555, #564, #581, #589, #594
      (title-prefixed "🎨 Palette:") all show author.login = RB-chrismandich
      (is_bot: false) via `gh pr list --json author`, and their commits[].authors
      are the same account (`gh pr view <N> --json commits`). Palette is a Jules
      persona (docs/superpowers/specs/2026-06-14-jules-trigger-workflow-design.md;
      .jules/palette.md is its learning journal) — it opens PRs under whichever
      account's credentials invoked the Jules session, not a separate bot
      account. There is no "palette[bot]" GitHub login to verify or refute;
      asserting one would be a guess, not a fact. Identify these PRs by the
      "🎨 Palette:" title prefix and/or "palette/" branch prefix instead.
      Focus: CLI/terminal UX polish (colors, spacing, semantic status icons).

  bolt:
    author_login: null         # UNCONFIRMED as a distinct GitHub identity — see notes
    role: author
    invoke: n/a
    identified_by: title_prefix
    title_prefix: "⚡ Bolt:"
    branch_prefix: "bolt-"
    notes: >
      Checked 2026-07-17: PRs #530, #534, #541, #573, #580, #590, #595
      (title-prefixed "⚡ Bolt:") all show author.login = RB-chrismandich
      (is_bot: false) via `gh pr list --json author`, and their commits[].authors
      are the same account (`gh pr view <N> --json commits`). Same situation as
      palette: Bolt is a Jules persona, not a distinct GitHub bot account —
      identify by the "⚡ Bolt:" title prefix and/or "bolt-" branch prefix.
      Focus: performance micro-optimizations (fast-path checks, avoided
      re-parses/re-reads).
