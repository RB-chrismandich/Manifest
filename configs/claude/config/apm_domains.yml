# APM domain ownership registry — feature 522, FR-014 / FR-027.
#
# A "domain" is a deployed area with exactly one writer. This file names the
# domains APM owns. Legacy writers (`deploy_home_skills`, `sync-skills`) consult
# it via `apm_owns_domain()` and skip any domain listed here, so a domain is
# never written by two pipelines under two different ownership models.
#
# THIS FILE IS THE ONLY OWNERSHIP SIGNAL, and it deliberately lives in the repo
# rather than in the deployed tree. A marker shipped inside the rsync stream is
# present after ANY deploy — including one that was supposed to be disabled — so
# it cannot answer "is this ours?". (Learned the hard way in feature 481.)
#
# Adding a domain here makes it writer-less until APM actually deploys it. That
# gap is intentional and is what Phase 2 of the migration is for, but it is only
# safe because T053's un-gate procedure can hand a domain back to the legacy
# writer mid-migration. Do not add a domain without checking that escape hatch
# still works.
#
# Values are bare domain names, matched exactly. Known domains:
#   skills   ~/.claude/skills (+ the Cursor/Gemini/Codex/Antigravity symlinks)
domains:
  # Activated 2026-07-28 (SC-006). apm owns ~/.claude/skills; deploy_home_skills
  # and sync-skills stand down for it. The four sibling harness homes inherit by
  # symlink (T005 cell (i)), so this one entry covers all five.
  #
  # Deployed BEFORE gating, deliberately: the reverse order leaves the domain
  # writer-less in between, and on a live machine that is a window where skills
  # silently stop updating. A brief double-claim is the safer failure.
  #
  # To hand it back: configs/claude/scripts/apm_ungate_domain.sh skills --apply
  - skills

# --- third state (T2.1, spec 674) ----------------------------------------- #
#
# A domain listed here is owned by NEITHER pipeline. It exists because the
# registry was strictly two-state: listed meant APM writes, and UNLISTED MEANT
# THE LEGACY WRITER WRITES. So handing `skills` to plugins by simply removing it
# from `domains:` would not stand a writer down — it would re-arm two of them,
# refill ~/.claude/skills, and double-load all 108 skills against their plugin
# twins with no dedup and no error.
#
# All three writers consult this via `domain_retired()` and refuse:
#   deploy_home_skills (bootstrap/lib/common.sh)
#   sync-skills.sh
#   apm_dev_sync.sh   — refuses BEFORE staging; its pre-existing apm_owns_domain
#                       calls run after `apm install` and gate only a printed note
#
# DELIBERATELY EMPTY until the harness tree exists. Moving `skills` here before
# T2.3/T2.4 stand up ~/.manifest/skills would leave all five assistants with no
# skills at all — every writer would correctly decline, and nothing would have
# taken over yet.
retired: []
