# Knowledge Base — Structured Learning Storage
# Managed by: learning-capture skill, antipattern-detect skill
# Utility: ~/.claude/scripts/learning_capture.sh
# Format: entries indexed by ID with category, language, and metadata
#
# Categories:
#   - pattern          — recommended coding patterns and best practices
#   - antipattern      — detected antipatterns to avoid
#   - tool_discovery   — new/better tooling recommendations
#   - config_insight   — configuration tips and environment setup
#
# Confidence levels: high, medium, low
# Languages: python, go, typescript, javascript, bash, terraform, yaml, general

entries:
  - id: ANTI-001
    title: "Unquoted variable expansion in shell commands"
    category: antipattern
    language: bash
    description: >
      User-controlled values passed to bash -c, eval, or unquoted in command strings
      cause command injection (CWE-78). Always quote variables; use arrays for command
      arguments; avoid bash -c with interpolated strings.
    tags: [security, injection, shellcheck, SC2086]
    confidence: high
    created: 2026-01-01
    last_seen: 2026-02-11
    occurrences: 8
    source: antipattern-detect
    severity: critical
    detection_cue:
      bash: "unquoted $var in commands; bash -c/eval with interpolated strings"
      python: "subprocess(shell=True) or os.system with f-string user input"
      typescript: "child_process exec with template literals; SQL built by string concat"
      go: "exec.Command(\"sh\", \"-c\", input); fmt.Sprintf into SQL"
    prevention_rule: >
      Never interpolate untrusted values into commands or queries: quote all shell
      expansions, pass argv arrays (no shell=True / -c), and use parameterized
      queries or prepared statements for SQL.
    provenance: research-seed

  - id: ANTI-002
    title: "Insecure temporary file/directory creation"
    category: antipattern
    language: bash
    description: >
      Using predictable temp paths or mkdir without mktemp enables symlink attacks
      (CWE-377). Always use mktemp -d with templates; set umask 0077; use trap for
      cleanup.
    tags: [security, temp-files, CWE-377, mktemp]
    confidence: high
    created: 2026-01-15
    last_seen: 2026-02-05
    occurrences: 3
    source: antipattern-detect
    severity: high
    detection_cue:
      bash: "hardcoded /tmp/<name>; mkdir under /tmp without mktemp; no trap cleanup"
      python: "open()/os.mkdir on literal /tmp paths instead of the tempfile module"
    prevention_rule: >
      Create temp files/dirs with mktemp (or the language's tempfile API), set a
      restrictive umask, and register cleanup (trap/finally) so paths are
      unpredictable and never leak.
    provenance: research-seed

  - id: ANTI-003
    title: "Stale file-path references in pre-commit hooks"
    category: antipattern
    language: yaml
    description: >
      Local pre-commit hooks reference old directory paths after refactors, causing
      hooks to silently never match any files. Update all path patterns in
      .pre-commit-config.yaml as part of every directory restructuring; add a CI check
      that validates hook file patterns match existing paths.
    tags: [architecture, pre-commit, file-paths, refactoring]
    confidence: high
    created: 2026-02-11
    last_seen: 2026-02-11
    occurrences: 3
    source: antipattern-detect

