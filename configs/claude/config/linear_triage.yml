# Linear Issue Triage Configuration
# Controls thresholds, scoring formulas, and safety rules for automated issue management

# Duplicate detection thresholds
duplicate_detection:
  title_similarity_high: 0.80      # Auto-flag as HIGH confidence duplicate
  title_similarity_medium: 0.65    # Gray area - use parallel agents
  description_overlap_high: 0.70
  description_overlap_medium: 0.50
  same_team_boost: 0.05            # Boost score if same team
  shared_labels_boost: 0.05        # Boost score per shared label

# Staleness criteria
staleness:
  inactivity_days: 90               # No updates in 90+ days
  file_missing_threshold: 0.5       # >50% referenced files missing
  blocker_inactive_days: 180        # Blocked issue with blocker untouched 180+ days
  deprecated_components:
    - name: "legacy-auth"
      deprecated_date: "2025-11-01"
      replacement: "oauth2-service"
    - name: "old-api-v1"
      deprecated_date: "2025-09-15"
      replacement: "api-v2"

# Priority scoring formula
# Score = (Impact × 3) + (Urgency × 2) + (Readiness × 2) - Risk
# Each dimension rated 1-5
priority:
  formula:
    impact_weight: 3
    urgency_weight: 2
    readiness_weight: 2
    risk_weight: -1

  # Score to Linear priority (0-4) mapping
  mapping:
    urgent: 28        # score ≥28 → priority 1 (Urgent)
    high: 22          # score ≥22 → priority 2 (High)
    medium: 16        # score ≥16 → priority 3 (Medium)
    low: 10           # score ≥10 → priority 4 (Low)
    none: 0           # score <10  → priority 0 (None)

  # Priority labels for context
  labels:
    1: "Urgent"
    2: "High"
    3: "Medium"
    4: "Low"
    0: "None"

# Parallel agent consensus
consensus:
  high_threshold: 0.80      # ≥80% = high confidence
  medium_threshold: 0.50    # 50-79% = medium confidence
  use_for_priority: true    # Use agents for priority scoring
  use_for_duplicates: true  # Use agents for duplicate detection
  timeout_seconds: 300      # 5 min timeout per agent call

# Action safety rules
actions:
  # Always safe to execute (even in non-dry-run)
  always_safe:
    - mark_duplicate
    - add_comment
    - link_related
    - add_label

  # Requires user confirmation before execution
  requires_confirmation:
    - cancel_issue
    - update_priority
    - update_status
    - remove_label

  # Never execute automatically (manual only)
  never_auto:
    - delete_issue
    - merge_descriptions
    - create_issue
    - modify_description

# Batch processing
batch:
  chunk_size: 15              # Process 15 issues per batch
  max_concurrent: 3           # Max 3 parallel agent calls
  cache_ttl_seconds: 604800   # Cache results for 7 days

# Output formats
output:
  report_format: markdown     # markdown or json
  include_audit_trail: true   # Log all actions taken
  confidence_thresholds:
    high: 0.85                # Display as HIGH
    medium: 0.70              # Display as MEDIUM
    low: 0.50                 # Display as LOW
