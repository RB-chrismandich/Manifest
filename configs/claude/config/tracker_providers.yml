# tracker_providers.yml — issue-tracker provider registry (evolves lifecycle_providers.yml;
# spec: docs/superpowers/specs/2026-07-16-agent-app-agnostic-skills-design.md).
# Access precedence per provider is an ORDERED list: mcp > cli > git > api.
# Agent-context skills use the first available method; hooks/scripts start at cli.

default_provider: github   # used when no override and remote is not github/gitlab

# Nine lifecycle phases collapse onto four coarse canonical statuses (mirrored to trackers).
phase_to_canonical_status:
  specify: planned
  clarify: planned
  spec_review_product: planned
  plan: in-progress
  task_creation: in-progress
  analyze: in-progress
  spec_review_tech: in-progress
  implement: in-progress
  verify: needs-review        # -> done once verify passes AND merged
  done: done                  # terminal phase (verify passed + merged)

# Canonical operations (implemented by tracker_ops.sh): issue-list issue-view
# issue-create issue-comment issue-transition issue-label issue-close
# duplicate-mark sub-issue-create sub-issue-list.
# Where a provider lacks a native construct the mapping is documented here:
# duplicate-mark = native state on linear/jira; close + "Duplicate of #N"
# comment + `duplicate` label on github/gitlab.

providers:
  github:
    access: [cli, api]      # prepend mcp when a GitHub MCP server is registered
    verified: true           # Task 12 matrix (2026-07-17): 9/9 PASS, 2/2 N/A (docs/superpowers/specs/2026-07-17-tracker-contract-matrix.md)
    status_via: label         # canonical status applied as a label
    tier_map:
      1: project_v2           # no native issue type -> see missing_tier_behavior
      2: milestone
      3: issue
      4: sub_issue            # native Sub-Issues API
    status_map:               # canonical -> label (labels.yml)
      planned: planned
      in-progress: in-progress
      needs-review: needs-review
      done: done
    missing_tier_behavior: error   # tier 1 has no native type; error names it unless overridden

  gitlab:
    access: [cli, api]
    verified: false
    status_via: label
    tier_map:
      1: epic                 # Premium/Ultimate
      2: epic
      3: issue
      4: child_issue
    status_map:
      planned: planned
      in-progress: in-progress
      needs-review: needs-review
      done: done
    missing_tier_behavior: error

  linear:
    access: [mcp, cli, api]  # cli = linear_ops.sh GraphQL engine
    verified: false
    status_via: transition    # Linear workflow STATE (via GraphQL), not a label
    tier_map:
      1: initiative
      2: project
      3: issue
      4: sub_issue            # parentId
    status_map:               # Linear workflow states (by team); names resolved at runtime
      planned: Backlog
      in-progress: In Progress
      needs-review: In Review
      done: Done
    missing_tier_behavior: error

  jira:
    access: [mcp]
    verified: false
    status_via: transition    # Jira workflow transition (resolved to id at runtime)
    tier_map:
      1: Initiative           # requires Advanced Roadmaps / Premium
      2: Epic
      3: Task                 # or Story
      4: Sub-task
    # canonical -> Jira workflow TRANSITION (resolved to id at runtime via
    # getTransitionsForJiraIssue; NEVER free-text status, FR-021)
    status_map:
      planned: "To Do"
      in-progress: "In Progress"
      needs-review: "In Review"
      done: "Done"
    missing_tier_behavior: error
    mcp_tools:
      get_issue: getJiraIssue
      search: searchJiraIssuesUsingJql
      transitions: getTransitionsForJiraIssue
      transition: transitionJiraIssue
      issue_types: getJiraProjectIssueTypesMetadata
      create: createJiraIssue
      comment: addCommentToJiraIssue
