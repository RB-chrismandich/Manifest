---
# doc_limits.yml — line-count caps and fluff patterns for the docs-* skills.
#
# Read by configs/claude/scripts/docs_lint.py and by docs-improve,
# docs-improve-readme, docs-generate-diagrams, docs-all. The prose contract
# (why these numbers, how to split an over-cap doc) lives in
# configs/claude/references/doc-concision.md — this file is the machine copy.
#
# Counting rule: TOTAL lines, `wc -l` parity. Not "prose lines" — a reader
# scrolling a 900-line page does not get a discount for the code blocks.

# Applied when no type-specific rule matches.
defaults:
  max_lines: 250
  # Fraction of max_lines above which a doc is reported NEAR (advisory).
  warn_at: 0.8

# Diataxis quadrants plus the three structural page kinds. `purpose` is the
# one-line test for "is this doc that type?" — it is what the skills read.
types:
  hub:
    max_lines: 120
    purpose: >-
      Navigation only: what lives here and one line per child page.
      A hub that explains things is an explanation page wearing a hub's name.
  readme_root:
    max_lines: 200
    purpose: >-
      What this is, how to run it, where to go next. Everything a reader
      needs past the first ten minutes belongs in docs/ and is linked, not
      inlined.
  tutorial:
    max_lines: 200
    purpose: >-
      One learner, one lesson, start to finish. Two lessons is two pages.
  howto:
    max_lines: 200
    purpose: >-
      One goal, ordered steps, one working example. Not a survey of options.
  reference:
    max_lines: 400
    purpose: >-
      Lookup surface (flags, keys, endpoints, schema). Highest cap because
      readers arrive via search and leave, but split by subject once over.
  explanation:
    max_lines: 250
    purpose: >-
      Why the system is shaped this way. Background and trade-offs, no steps.
  diagram:
    max_lines: 300
    purpose: >-
      Rendered visuals plus captions. Additional cap: max_diagrams per page.
    max_diagrams: 4

# First match wins. Globs are matched against the repo-relative path.
classify:
  - {glob: "README.md", type: readme_root}
  - {glob: "**/docs/README.md", type: hub}
  - {glob: "docs/README.md", type: hub}
  - {glob: "**/index.md", type: hub}
  - {glob: "**/*DIAGRAM*.md", type: diagram}
  - {glob: "**/*ARCHITECTURE*.md", type: explanation}
  - {glob: "**/GETTING_STARTED.md", type: tutorial}
  - {glob: "**/TUTORIAL*.md", type: tutorial}
  - {glob: "**/tutorials/**/*.md", type: tutorial}
  - {glob: "**/how-to/**/*.md", type: howto}
  - {glob: "**/HOWTO*.md", type: howto}
  - {glob: "**/TROUBLESHOOTING.md", type: howto}
  - {glob: "**/CONFIGURATION.md", type: reference}
  - {glob: "**/*REFERENCE*.md", type: reference}
  - {glob: "**/reference/**/*.md", type: reference}
  - {glob: "**/COMMANDS.md", type: reference}
  - {glob: "**/explanation/**/*.md", type: explanation}

# Never counted. Three kinds of file are exempt for three different reasons:
# generated files are the tool's problem, not the writer's; vendored trees are
# not ours to split; and dated records (plans, specs, reports, ADRs, baselines)
# are point-in-time artifacts — rewriting one to hit a cap would falsify it.
exempt:
  globs:
    - "CHANGELOG.md"
    - "**/CHANGELOG.md"
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/vendor/**"
    - "**/site-packages/**"
    - "**/.remember/**"
    # Records, not documentation.
    - "**/specs/**"
    - "**/plans/**"
    - "**/superpowers/**"
    - "**/baselines/**"
    - "**/decisions/**"
    - "**/*_REPORT.md"
    # Payloads shipped for other repos to copy — their caps, not ours.
    - "**/templates/**"
  # A doc containing any of these anywhere in its first 20 lines is generated.
  markers:
    - "<!-- generated"
    - "DO NOT EDIT"
    - "AUTO-GENERATED"
    - "Generated by"

# In-file overrides, both requiring a rationale after an em dash so the next
# reader can evaluate them (same contract as help-coverage exemptions):
#   <!-- doc-type: reference -->
#   <!-- doc-limit: 500 — flag table is one subject; splitting it hides flags -->
overrides:
  type_marker: "doc-type:"
  limit_marker: "doc-limit:"

# Advisory only — never fails the run. Case-insensitive, matched outside
# fenced code blocks and inline code. Each entry is a phrase that survives
# deletion: cutting it never removes a fact.
fluff:
  phrases:
    # Marketing adjectives that assert quality instead of showing it.
    - comprehensive
    - powerful
    - seamless
    - seamlessly
    - robust
    - cutting-edge
    - state-of-the-art
    - best-in-class
    - blazing fast
    - lightning fast
    - world-class
    - rich set of
    - wide range of
    - full-featured
    # Difficulty claims the reader gets to make, not the author.
    - simply
    - "it's easy to"
    - "it is easy to"
    - effortlessly
    - "just run"
    - "you just need"
    # Meta-narration about the document itself.
    - "in this document"
    - "in this section, we will"
    - "this guide will walk you through"
    - "let's dive"
    - "as mentioned above"
    - "as we can see"
    # Filler that front-loads nothing.
    - "it is important to note"
    - "it should be noted"
    - "please note that"
    - "note that the"
    - "needless to say"
    - "of course"
    - "obviously"
    - "basically"
  # Structural fluff, detected by shape rather than wording.
  structure:
    # A hand-maintained table of contents on a short page: the platform
    # renders one, and the hand copy goes stale.
    toc_below_lines: 100
    # Horizontal rules per 100 lines. A ratio, not a count: a long page
    # legitimately has more section breaks than a short one, and an absolute
    # cap just flags every long page for being long.
    max_hrules_per_100_lines: 3
    # Below this many rules a page is never flagged, whatever the ratio.
    hrule_floor: 4
