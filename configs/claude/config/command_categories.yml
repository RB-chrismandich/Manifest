# Command category taxonomy (spec 362-command-help-hints, research D1)
#
# This file defines the VALID discovery taxonomy ONLY: the closed set of category
# keys, their human labels, and a stable display order. It is NOT a competing
# assignment source.
#
# Category assignment precedence (command_catalog.py):
#   1. a per-skill `category:` in SKILL.md frontmatter is authoritative;
#   2. the `overrides:` map below wins ONLY for commands it explicitly names
#      (escape hatch for skills not yet carrying frontmatter);
#   3. otherwise -> `uncategorized` (always sorts last).
#
# Adding a category is a deliberate edit here. Keep the set small enough to scan.

categories:
  - key: git-pr
    label: "Git & PRs"
    order: 1
  - key: docs
    label: "Documentation"
    order: 2
  - key: security
    label: "Security"
    order: 3
  - key: planning
    label: "Planning & Specs"
    order: 4
  - key: skills
    label: "Skill Authoring"
    order: 5
  - key: ci-cd
    label: "CI/CD, Testing & Quality"
    order: 6
  - key: infra
    label: "Infrastructure & Config"
    order: 7
  - key: meta
    label: "Meta & Orchestration"
    order: 8

# Explicit category assignments for skills that do not (yet) carry a `category:`
# in their own frontmatter. Frontmatter, where present, still wins over this map.
# key = skill name, value = a category key from the list above.
