# Command Configuration
# Thresholds and policies for Claude Code native commands
# Referenced by commands in ~/.claude/commands/

# Parallel agent trigger thresholds (configurable)
thresholds:
  # Documentation commands
  docs_improve_lines: 500         # Trigger parallel agents when total doc lines > 500
  docs_diagrams_modules: 5       # Trigger when analyzing 5+ unique imports/modules

  # Code quality skill auto-triggers
  skill_file_lines: 500           # File > 500 lines
  skill_function_count: 10        # > 10 functions per file
  skill_class_count: 5            # > 5 classes per file
  skill_cyclomatic_complexity: 15  # Cyclomatic complexity > 15

# Security patterns that trigger code-quality skill
security_patterns:
  # Authentication/authorization
  - auth
  - login
  - session
  - jwt
  - oauth

  # Cryptography
  - crypto
  - encrypt
  - decrypt
  - hash
  - salt

  # Secrets handling
  - secret
  - api_key
  - password
  - token
  - credential
  - private_key

  # Input validation
  - sanitize
  - validate
  - escape
  - filter

# Consensus thresholds for parallel agent decisions (float 0.0-1.0)
consensus:
  high: 0.80    # >=80%: Auto-proceed with unified recommendation
  medium: 0.50  # 50-79%: Highlight disagreements to user
  low: 0.0      # <50%: Block and escalate for human review

# Prioritization hierarchy for synthesis (in order)
synthesis_priority:
  - security        # Security issues always first
  - correctness     # Functional bugs
  - performance     # Performance issues
  - maintainability  # Code quality
  - style           # Formatting and style

# Tool policies per command
tool_policies:
  docs-readme:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
    parallel_agents: never
    validation_tier: 2

  refactor-python:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
      - Write
      - Edit  # Read-only analysis
    parallel_agents: always
    validation_tier: 1
    mcp_servers:
      - context7   # Python library/API documentation
      - deepwiki   # Dependency internals and upstream contracts

  docs-diagrams:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash  # No shell for security
    parallel_agents: conditional
    trigger_condition: unique_imports >= 5
    validation_tier: 2

  docs-improve:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
    parallel_agents: conditional
    trigger_condition: total_doc_lines >= 500
    validation_tier: 2
    mcp_servers:
      - deepwiki   # Cross-reference dependency docs for accuracy
      - context7   # Library/API docs for code examples in documentation

  refactor-shell:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash  # Needed for shellcheck and yamllint
    forbidden:
      - Write
      - Edit  # Read-only analysis
    parallel_agents: always
    validation_tier: 1
    security_cli:
      - semgrep    # Local SAST scanning via CLI (requires Bash)

  refactor-node:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
      - Write
      - Edit  # Read-only analysis
    parallel_agents: always
    validation_tier: 1
    mcp_servers:
      - context7   # Node/TS library documentation
      - deepwiki   # Dependency internals and upstream contracts

  refactor-go:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
      - Write
      - Edit  # Read-only analysis
    parallel_agents: always
    validation_tier: 1
    mcp_servers:
      - context7   # Go library documentation
      - deepwiki   # Dependency internals and upstream contracts

  refactor-terraform:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
      - Write
      - Edit  # Read-only analysis
    parallel_agents: always
    validation_tier: 1
    mcp_servers:
      - opentofu   # OpenTofu registry, provider/module docs, resource reference
    security_cli:
      - semgrep    # Local SAST scanning via CLI (requires Bash)

  plan-manage:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # parallel_agent.py, git_ops.sh, mv, date
      - Write  # Creating new plans from template
      - Edit   # Checking off deliverables during execute
      - Task   # Synthesis agent on disagreement
    forbidden: []
    parallel_agents: conditional
    trigger_condition: security OR architecture OR scope >= 3 files OR critical_logic OR issue_execute_review
    validation_tier: 2
    mcp_servers:
      - deepwiki   # Research external deps and upstream APIs during planning
      - linear     # Issue context and acceptance criteria
      - atlassian  # Jira/Confluence context when project uses Atlassian
      - glean      # Internal team knowledge, runbooks, ADRs
      - opentofu   # OpenTofu registry docs when planning IaC changes

  code-quality:  # skill
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
      - Write
      - Edit  # Read-only for auto-trigger
    parallel_agents: always
    validation_tier: 1
    mcp_servers:
      - context7   # Library docs for security best practices
    security_cli:
      - semgrep    # Local SAST scanning via CLI (requires Bash)

  issue-triage:
    allowed:
