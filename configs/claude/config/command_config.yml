# Command Configuration
# Thresholds and policies for Claude Code native commands
# Referenced by commands in ~/.claude/commands/

# Native sub-agent trigger thresholds
thresholds:
  # Documentation commands
  docs_improve_lines: 500         # Trigger native dispatch when total doc lines > 500
  docs_diagrams_modules: 5       # Trigger when analyzing 5+ unique imports/modules

  # Advisory complexity signals; never independently activate code-audit or review fan-out.
  skill_file_lines: 500           # File > 500 lines
  skill_function_count: 10        # > 10 functions per file
  skill_class_count: 5            # > 5 classes per file
  skill_cyclomatic_complexity: 15  # Cyclomatic complexity > 15

# Security search vocabulary only; semantic activation is in skill_policies.yml.
security_patterns:
  # Authentication/authorization
  - auth
  - login
  - session
  - jwt
  - oauth

  # Cryptography
  - crypto
  - encrypt
  - decrypt
  - hash
  - salt

  # Secrets handling
  - secret
  - api_key
  - password
  - token
  - credential
  - private_key

  # Input validation
  - sanitize
  - validate
  - escape
  - filter

# Canonical review-routing policy. Counts and vocabulary never escalate alone.
review_escalation:
  default_mode: single-agent
  conditions:
    - trust_boundary_change
    - destructive_behavior
    - broad_compatibility_or_deployment_change
    - conflicting_evidence_or_unresolved_uncertainty
    - codebase_wide_independent_tracks
  trigger_condition: &review_risk_trigger >-
    trust_boundary_change OR destructive_behavior OR broad_compatibility_or_deployment_change OR
    conflicting_evidence_or_unresolved_uncertainty OR codebase_wide_independent_tracks
  non_triggers:
    - file_size
    - package_count
    - module_count
    - language
    - generic_keyword
    - independent_unit_count
  verification:
    mode: check-only
    missing_tool_result: unavailable
    checkout_trust: untrusted
    allowed_without_isolation:
      - trusted_preinstalled_static_tool_treating_checkout_as_data
    requires_verified_isolation:
      - project_controlled_tests_scripts_and_build_steps
      - checkout_controlled_executable_config_plugins_hooks_imports_or_discovery
    insufficient_isolation:
      - source_inspection
      - check_only_flags
      - changed_home
      - temporary_directory
      - read_only_checkout
    isolation_requirements:
      - protect_original_checkout_and_host_files
      - expose_no_credentials_or_host_control_sockets
      - deny_unauthorized_network_access
      - confine_writes_to_disposable_storage
    unavailable_isolation_result: skip_and_report_unavailable
    forbidden_operations:
      - automatic_fixes
      - format_writes
      - installations
      - deployments
      - remediation
    instructions: >-
      Treat the reviewed checkout as untrusted. Outside verified isolation, run only
      trusted preinstalled static tools that treat checkout files as data, with
      checkout-controlled executable configuration, plugins, hooks, imports, and
      executable discovery disabled. Project-controlled tests, scripts, build steps,
      and checks that load project code require enforced isolation satisfying every
      isolation requirement above. Source inspection, check-only flags, a changed HOME,
      a temporary directory, or a read-only checkout do not establish isolation. If
      isolation is unavailable or uncertain, skip execution and report unavailable
      with the reason. Never apply fixes, write formatting changes, install, deploy,
      or remediate. Record each command and result.
  report_fields:
    - review_mode
    - escalation_reason
    - checks


# Tool policies per command
#
# Sub-agent fields (see configs/claude/references/sub-agent-dispatch.md):
#   subagents: always|conditional|never
#   subagent_trigger: "<expr>"       # REQUIRED when conditional
#   subagent_rationale: "<one line>" # REQUIRED when never
# Every skill directory with a SKILL.md carries a `subagents` value. Skill prose
# links the shared current-host dispatch rules; this file is the canonical policy store.
tool_policies:
  issue-dev-auto:
    allowed:
      - Bash       # auto_issue_dev.sh, pr_merge_loop.sh, merge_decision.sh, verification_gate.sh, loop_lock.sh, gh/glab
      - Read
      - Edit       # writes code for the selected issue
      - Write
      - Skill      # test-driven-development, project-verify, pr-address-comments, pr-review
    forbidden: []
    validation_tier: 1

    subagents: never
    subagent_rationale: Develops exactly one issue per invocation then stops; /loop handles iteration.
  pr-monitor:
    allowed:
      - Bash
      - Read
      - Edit
      - Write
    forbidden: []
    validation_tier: 1            # pushes commits + posts PR comments

    subagents: never
    subagent_rationale: Self-paced interactive loop babysitting a single PR sequentially.
  pr-smoke:
    allowed:
      - Bash       # run_pr_regression.sh: lint/bats/pytest, bootstrap, check_status
      - Read
      - Skill      # may hand a failing gate to systematic-debugging
    forbidden:
      - Write      # read-only on repo source; only validates, never edits
      - Edit
    validation_tier: 2            # verification skill; no source mutation

    subagents: never
    subagent_rationale: Single deterministic bundled runner executing sequential whole-repo gates.
  smoke-manage:
    allowed:
      - Bash       # smoke_test.py append/run/list/prune; opt-in playwright install
      - Read
      - Write      # appends/updates committed smoke-catalog/<app>.yaml
      - Edit
      - Skill      # may hand a failing gate to systematic-debugging
    forbidden: []
    validation_tier: 1            # executes CLI/shell steps + handles env-injected secrets
    subagents: never
    subagent_rationale: Single config-driven engine runs the tiered catalog sequentially via one smoke_test.py run; no independent fan-out units.

  lifecycle-run:
    allowed:
      - Bash       # lifecycle.sh init/status/advance/subtask/provision/verdict/reconcile/audit; smoke_test.py; spec_review.sh
      - Read
      - Write      # per-track JSON state under the Manifest state root
      - Edit
      - Skill      # drives the per-phase /manifest-spec-planning:* spec commands
    forbidden: []
    validation_tier: 1            # safety-gate logic + handles env-injected provider secrets
    subagents: never
    subagent_rationale: Single config-driven engine runs the catalog sequentially via one script.
  issue-sync-pr:
    allowed:
      - Bash
      - Read
    forbidden:
      - Write
      - Edit
    validation_tier: 1
    enabled: true              # opt-in runtime gate (install_issue_hooks.sh --enable)
    hook_timeout_seconds: 5     # fail-open soft timeout bound

    subagents: never
    subagent_rationale: Single-PR fail-open hook mutating tracker issue state.
  issue-sync-commit:
    allowed:
      - Bash
      - Read
    forbidden:
      - Write
      - Edit
    validation_tier: 1
    enabled: true              # opt-in runtime gate
    hook_timeout_seconds: 5     # fail-open soft timeout bound
    commit_hook_mode: sync      # sync only in v1; 'background' reserved (falls back to sync)

    subagents: never
    subagent_rationale: Fail-open hook mutating one linked issue per commit; sequential shared-state.
  docs-improve-readme:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # docs_lint.py only — the line cap must be measured, not judged
    validation_tier: 2

    subagents: never
    subagent_rationale: 'Single-target: improves one README from code-derived facts.'
  python-refactor:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash  # Check-only verification under review_escalation.verification
    forbidden:
      - Write
      - Edit  # Read-only analysis
    bash_mode: check-only

    validation_tier: 1
    mcp_servers:
      - context7   # Python library/API documentation
      - deepwiki   # Dependency internals and upstream contracts

    subagents: conditional
    subagent_trigger: *review_risk_trigger
    subagent_rationale: Read-only refactor assessment; dispatch independent review only for defined high-risk or multi-track findings.
  code-audit-constitution:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash    # constitution_check.py, the language toolchain, the test suite
      - Write   # extracted payload/template files and their tests
      - Edit    # remediation: this skill changes source, unlike <lang>-refactor
    validation_tier: 2
    mcp_servers:
      - context7   # library/API docs when a loader or dependency is evaluated

    subagents: conditional
    subagent_trigger: independent_units >= 3
  docs-generate-diagrams:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # docs_lint.py only — the page/diagram caps must be measured
    validation_tier: 2

    subagents: conditional
    subagent_trigger: unique_imports >= 5
  docs-improve:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # docs_lint.py only — before/after caps are a measured delta
    validation_tier: 2
    mcp_servers:
      - deepwiki   # Cross-reference dependency docs for accuracy
      - context7   # Library/API docs for code examples in documentation

    subagents: conditional
    subagent_trigger: doc_topics >= 10
    subagent_rationale: >-
      Was `never` when the output was one holistic health score. The unit of
      work is now a topic directory held to its own line cap, and those are
      independent — above ~10 docs, one sub-agent per topic.
  shell-refactor:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash  # Check-only verification under review_escalation.verification
    forbidden:
      - Write
      - Edit  # Read-only analysis
    bash_mode: check-only

    validation_tier: 1
    security_cli:
      - semgrep    # Local SAST scanning via CLI (requires Bash)

    subagents: conditional
    subagent_trigger: *review_risk_trigger
    subagent_rationale: Read-only refactor assessment; dispatch independent review only for defined high-risk or multi-track findings.
  node-refactor:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash  # Check-only verification under review_escalation.verification
    forbidden:
      - Write
