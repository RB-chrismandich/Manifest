# Command Configuration
# Thresholds and policies for Claude Code native commands
# Referenced by commands in ~/.claude/commands/

# Parallel agent trigger thresholds (configurable)
thresholds:
  # Documentation commands
  docs_improve_lines: 500         # Trigger parallel agents when total doc > 500
  docs_diagrams_modules: 5       # Trigger when analyzing 5+ unique imports

  # Code quality skill auto-triggers
  skill_file_lines: 500           # File > 500 lines
  skill_function_count: 10        # > 10 functions per file
  skill_class_count: 5            # > 5 classes per file
  skill_cyclomatic_complexity: 15  # Cyclomatic complexity > 15

# Security patterns that trigger code-quality skill
security_patterns:
  # Authentication/authorization
  - auth
  - login
  - session
  - jwt
  - oauth

  # Cryptography
  - crypto
  - encrypt
  - decrypt
  - hash
  - salt

  # Secrets handling
  - secret
  - api_key
  - password
  - token
  - credential
  - private_key

  # Input validation
  - sanitize
  - validate
  - escape
  - filter

# Consensus thresholds for parallel agent decisions (float 0.0-1.0)
consensus:
  high: 0.80    # >=80%: Auto-proceed with unified recommendation
  medium: 0.50  # 50-79%: Highlight disagreements to user
  low: 0.0      # <50%: Block and escalate for human review

# Prioritization hierarchy for synthesis (in order)
synthesis_priority:
  - security        # Security issues always first
  - correctness     # Functional bugs
  - performance     # Performance issues
  - maintainability  # Code quality
  - style           # Formatting and style

# Tool policies per command
tool_policies:
  docs-readme:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
    parallel_agents: never
    validation_tier: 2

  refactor-python:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
      - Write
      - Edit  # Read-only analysis
    parallel_agents: always
    validation_tier: 1
    mcp_servers:
      - context7   # Python library/API documentation
      - deepwiki   # Dependency internals and upstream contracts

  docs-diagrams:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash  # No shell for security
    parallel_agents: conditional
    trigger_condition: unique_imports >= 5
    validation_tier: 2

  docs-improve:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
    parallel_agents: conditional
    trigger_condition: total_doc_lines >= 500
    validation_tier: 2
    mcp_servers:
      - deepwiki   # Cross-reference dependency docs for accuracy
      - context7   # Library/API docs for code examples in documentation

  refactor-shell:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash  # Needed for shellcheck and yamllint
    forbidden:
      - Write
      - Edit  # Read-only analysis
    parallel_agents: always
    validation_tier: 1
    security_cli:
      - semgrep    # Local SAST scanning via CLI (requires Bash)

  refactor-node:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
      - Write
      - Edit  # Read-only analysis
    parallel_agents: always
    validation_tier: 1
    mcp_servers:
      - context7   # Node/TS library documentation
      - deepwiki   # Dependency internals and upstream contracts

  refactor-go:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
      - Write
      - Edit  # Read-only analysis
    parallel_agents: always
    validation_tier: 1
    mcp_servers:
      - context7   # Go library documentation
      - deepwiki   # Dependency internals and upstream contracts

  refactor-terraform:
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
      - Write
      - Edit  # Read-only analysis
    parallel_agents: always
    validation_tier: 1
    mcp_servers:
      - opentofu   # OpenTofu registry, provider docs, resource reference
    security_cli:
      - semgrep    # Local SAST scanning via CLI (requires Bash)

  plan-manage:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # parallel_agent.sh, git_ops.sh, mv, date
      - Write  # Creating new plans from template
      - Edit   # Checking off deliverables during execute
      - Task   # Synthesis agent on disagreement
    forbidden: []
    parallel_agents: conditional
    trigger_condition: security OR architecture OR scope >= 3 files OR
      critical_logic OR issue_execute_review
    validation_tier: 2
    mcp_servers:
      - deepwiki   # Research external deps and APIs during planning
      - linear     # Issue context and acceptance criteria
      - atlassian  # Jira/Confluence context when project uses Atlassian
      - glean      # Internal team knowledge, runbooks, ADRs
      - opentofu   # OpenTofu registry docs when planning IaC changes

  code-quality:  # skill
    allowed:
      - Read
      - Glob
      - Grep
    forbidden:
      - Bash
      - Write
      - Edit  # Read-only for auto-trigger
    parallel_agents: always
    validation_tier: 1
    mcp_servers:
      - context7   # Library docs for security best practices
    security_cli:
      - semgrep    # Local SAST scanning via CLI (requires Bash)

  issue-triage:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # linear_ops.sh, parallel_agent.sh, jq
      - Task      # Parallel verification for duplicates/staleness
      - AskUserQuestion  # User confirmation for actions
    forbidden:
      - Write
      - Edit      # Read-only analysis; mutations via linear_ops.sh only
    parallel_agents: conditional
    trigger_condition: scenario_based
    validation_tier: 2
    mcp_servers:
      - linear      # Primary: Linear MCP for issue operations
      - atlassian   # Jira issues when project uses Atlassian

  issue-prioritize:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # gh, glab, linear_ops.sh, parallel_agent.sh, jq
      - Task      # Parallel agent scoring for top candidates
      - AskUserQuestion  # Clarify platform or project context
    forbidden:
      - Write
      - Edit      # Strictly read-only — no file or issue mutations
    parallel_agents: conditional
    trigger_condition: top_candidates_scoring
    validation_tier: 2
    mcp_servers:
      - linear      # Primary: Linear issue data
      - atlassian   # Jira issues when project uses Atlassian

  health-check:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # CLI version checks, auth status, curl, stat, test
    forbidden:
      - Write
      - Edit      # Read-only diagnostic
      - Task
    parallel_agents: never
    validation_tier: 2

  browser-test:  # skill
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # browser_test.sh, browser-use CLI, python3
    forbidden:
      - Write
      - Edit      # Test execution only — does not modify source
    parallel_agents: conditional
    trigger_condition: critical_user_flows OR test_files >= 3
    validation_tier: 2
    mcp_servers:
      - context7   # browser-use library documentation
      - deepwiki   # browser-use internals and API contracts

  sync-configs:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash      # stat, readlink, diff
    forbidden:
      - Write
      - Edit      # Read-only diagnostic
      - Task
    parallel_agents: never
    validation_tier: 2

# Error recovery strategies
error_recovery:
  timeout_seconds: 120
  max_retries: 1
  fallback_strategy: single_agent  # Options: single_agent, warn, abort

  on_timeout:
    action: retry_once_then_fallback
    message: "Agents timed out, falling back to single-agent analysis"

  on_one_agent_fails:
    action: continue_with_available
    message: "One agent failed, continuing with available agent output"

  on_both_agents_fail:
    action: warn_and_proceed
    message: "Both agents failed, proceeding without parallel validation"

  on_synthesis_fails:
    action: show_raw_outputs
    message: "Synthesis failed, presenting raw agent outputs"

# Parallel agent script configuration
parallel_agent:
  script_path: ~/.claude/scripts/parallel_agent.sh
  output_dir: ~/.claude/.agent_outputs
  default_options:
    - --json
    - --validate
  modes:
    review: --review
    analyze: --analyze
    prompt: ""  # Generic prompt mode

# Model selection
# Canonical model tier definitions (IDs and fallbacks) are in parallel_agent.yml.
# This section only contains task-based routing logic (tier per task type).

# Task-based model defaults (used by orchestrator)
# The orchestrating agent (Claude) selects models based on task type
task_model_defaults:
  security:
    cursor: advanced
    claude: opus
    gemini: pro
    reason: "Security-critical code requires maximum model capability"

  review:
    cursor: flash
    claude: sonnet
    gemini: flash
    reason: "Code review benefits from balanced capability/speed"

  analyze:
    cursor: flash
    claude: sonnet
    gemini: flash
    reason: "Analysis tasks need good reasoning without opus cost"

  improve:
    cursor: mini
    claude: haiku
    gemini: flash
    reason: "Improvement suggestions can use lighter models"

  quick:
    cursor: mini
    claude: haiku
    gemini: flash
    reason: "Quick queries use lightest models for speed"

  issue_triage:
    cursor: flash
    claude: sonnet
    gemini: flash
    reason: "Balanced capability for semantic analysis"

  issue_prioritize:
    cursor: flash
    claude: sonnet
    gemini: flash
    reason: "Balanced capability for scoring refinement"

# Credit exhaustion fallback chains
# Canonical fallbacks are in parallel_agent.yml (credit_fallback section).
# The parallel_agent.sh script reads those values at runtime.
