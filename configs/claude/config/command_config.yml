# Command Configuration
# Thresholds and policies for Claude Code native commands
# Referenced by commands in ~/.claude/commands/

# Parallel agent trigger thresholds (configurable)
thresholds:
  # Documentation commands
  docs_improve_lines: 500         # Trigger parallel agents when total doc lines > 500
  docs_diagrams_modules: 5       # Trigger when analyzing 5+ unique imports/modules

  # Code quality skill auto-triggers
  skill_file_lines: 500           # File > 500 lines
  skill_function_count: 10        # > 10 functions per file
  skill_class_count: 5            # > 5 classes per file
  skill_cyclomatic_complexity: 15  # Cyclomatic complexity > 15

# Security patterns that trigger code-audit skill
security_patterns:
  # Authentication/authorization
  - auth
  - login
  - session
  - jwt
  - oauth

  # Cryptography
  - crypto
  - encrypt
  - decrypt
  - hash
  - salt

  # Secrets handling
  - secret
  - api_key
  - password
  - token
  - credential
  - private_key

  # Input validation
  - sanitize
  - validate
  - escape
  - filter

# Consensus thresholds for parallel agent decisions (float 0.0-1.0)
consensus:
  high: 0.80    # >=80%: Auto-proceed with unified recommendation
  medium: 0.50  # 50-79%: Highlight disagreements to user
  low: 0.0      # <50%: Block and escalate for human review

# Prioritization hierarchy for synthesis (in order)
synthesis_priority:
  - security        # Security issues always first
  - correctness     # Functional bugs
  - performance     # Performance issues
  - maintainability  # Code quality
  - style           # Formatting and style

# Tool policies per command
#
# Sub-agent fields (feature 367 — see configs/claude/references/sub-agent-dispatch.md):
#   parallel_agents: always|conditional|never|gate-only  # external parallel_agent.py cross-verification
#   trigger_condition: "<expr>"                           # scale gate for parallel_agents: conditional
#   subagents:         always|conditional|never           # native Task/Agent sub-agents (Claude)
#   subagent_trigger:  "<expr>"                            # REQUIRED when subagents: conditional; convention: independent_units >= 3
#   subagent_rationale: "<one line>"                       # for subagents: never (or a `> Sub-agents: not used — <reason>.` note in SKILL.md)
#   subagent_model:    haiku|sonnet|opus|charter           # REQUIRED when subagents: always|conditional. Default `sonnet`;
#                                                          # `charter` = per-role tiers in the CDDL charters. Escalate to `opus`
#                                                          # only for genuinely hard reasoning (measured: 2026-07-25 baseline).
# Every skill directory with a SKILL.md MUST carry a `subagents` value (enforced by tests/bats/subagent_policy.bats).
# command_config.yml is the canonical store; SKILL.md prose must agree and is verified by that test.
#
# Session-model fields (2026-07-25 credit baseline — see docs/MODEL-POLICY.md):
#   session_model:           opus|fable                    # omit = Opus, the default start model
#   session_model_rationale: "<one line>"                  # REQUIRED whenever session_model is set
# `fable` marks work that is genuinely long-horizon (hours of autonomous iteration). A skill that
# wants Fable ASKS the user to switch and waits for the answer — it never assumes Fable is active
# and never silently proceeds on the default. Enforced by tests/bats/subagent_policy.bats.
tool_policies:
  print-tune-bambu:
    allowed:
      - Read
      - Glob
      - Grep
      - Bash   # Reads local Bambu Studio profiles, mirrors the wiki, drives the headless slicer
      - Write  # Emits an importable user process preset
    parallel_agents: never
    parallel_agents_rationale: Grounded in the local slicer profile DB and verified by a real slice; consensus adds no signal a measurement does not.
    validation_tier: 2

    subagents: never
    subagent_rationale: Single-user workflow over local files and one wiki mirror; no independent branches of work to fan out.
  issue-dev-auto:
    allowed:
      - Bash       # auto_issue_dev.sh, git_ops.sh, pr_merge_loop.sh, merge_decision.sh, verification_gate.sh, loop_lock.sh, gh/glab
      - Read
      - Edit       # writes code for the selected issue
      - Write
      - Skill      # test-driven-development, project-verify, pr-address-comments, pr-review
    forbidden: []
    # Scope note: the DEVELOP loop never auto-wraps its own output in cross-verification
    # (parallel_agents: never). The MERGE gate, however, is a deliberate, bounded parallel-agent
    # review run via verification_gate.sh (#360) — that is gate-only and intentional, not a
    # contradiction of the develop-loop policy.
    parallel_agents: gate-only
    validation_tier: 1
    session_model: fable
    session_model_rationale: Unattended end-to-end issue development under /loop; hours of autonomous work per run.

    subagents: never
    subagent_rationale: Develops exactly one issue per invocation then stops; /loop handles iteration.
  pr-monitor:
    allowed:
      - Bash
      - Read
      - Edit
      - Write
    forbidden: []
    parallel_agents: never        # orchestrates other skills; no cross-verification fan-out
    validation_tier: 1            # pushes commits + posts PR comments

    subagents: never
    subagent_rationale: Self-paced interactive loop babysitting a single PR sequentially.
  pr-smoke:
    allowed:
      - Bash       # run_pr_regression.sh: lint/bats/pytest, bootstrap, check_status, parallel_agent
      - Read
      - Skill      # may hand a failing gate to systematic-debugging
    forbidden:
      - Write      # read-only on repo source; only validates, never edits
      - Edit
    parallel_agents: never        # a CI-mirror gate runner, not a cross-verification fan-out
    validation_tier: 2            # verification skill; no source mutation

    subagents: never
    subagent_rationale: Single deterministic bundled runner executing sequential whole-repo gates.
  smoke-manage:
    allowed:
      - Bash       # smoke_test.py append/run/list/prune; opt-in playwright install
      - Read
      - Write      # appends/updates committed smoke-catalog/<app>.yaml
      - Edit
      - Skill      # may hand a failing gate to systematic-debugging
    forbidden: []
    parallel_agents: never        # an authoring/gate tool, not a cross-verification fan-out
    validation_tier: 1            # executes CLI/shell steps + handles env-injected secrets
    subagents: never
    subagent_rationale: Single config-driven engine runs the tiered catalog sequentially via one smoke_test.py run; no independent fan-out units.

  lifecycle-run:
    allowed:
      - Bash       # lifecycle.sh init/status/advance/subtask/provision/verdict/reconcile/audit; smoke_test.py; spec_review.sh
      - Read
      - Write      # per-track JSON state under the Manifest state root
      - Edit
      - Skill      # drives the per-phase /speckit-* and /spec-review commands
    forbidden: []
    parallel_agents: never        # a state-gated driver, not a cross-verification fan-out
    validation_tier: 1            # safety-gate logic + handles env-injected provider secrets
    session_model: fable
    session_model_rationale: Drives a feature across all nine state-gated phases in one run; long-horizon by construction.
    subagents: never
    subagent_rationale: Single config-driven engine runs the catalog sequentially via one script.
  issue-sync-pr:
    allowed:
      - Bash
      - Read
    forbidden:
      - Write
      - Edit
    parallel_agents: never
    validation_tier: 1
    enabled: true              # opt-in runtime gate (install_issue_hooks.sh --enable)
    hook_timeout_seconds: 5     # fail-open soft timeout bound

    subagents: never
    subagent_rationale: Single-PR fail-open hook mutating tracker issue state.
  issue-sync-commit:
