[project]
name = "manifest-model-policy"
version = "0.1.0"
description = "Shared portable model policy for Manifest runtimes"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0.1,<7"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Editable installs import the deployed package from its scripts parent. This
# avoids Hatch's unsupported editable prefix rewrite while preserving the wheel
# layout produced by the mapping below.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "manifest_model_policy"
