[project]
name = "manifest-runtime"
version = "0.0.0"
description = "Manifest home-deployed Python runtime"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.1",
  "click==8.3.1",
  "manifest-model-policy==0.1.0",
]

[project.scripts]
manifest = "manifest_cli:main"

[dependency-groups]
smoke = ["playwright==1.62.0"]
smoke-agent = ["browser-use>=0.13.0"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "scripts/smoke_orchestrator",
  "scripts/skillclaw",
  "scripts/manifest_cli",
]

[tool.hatch.build.targets.wheel.sources]
"scripts/smoke_orchestrator" = "smoke_orchestrator"
"scripts/skillclaw" = "skillclaw"
"scripts/manifest_cli" = "manifest_cli"

[tool.uv.sources]
manifest-model-policy = { path = "scripts/manifest_model_policy", editable = true }
