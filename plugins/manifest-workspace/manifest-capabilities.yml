schema_version: 1
bundle:
  name: manifest-workspace
  version: 0.4.0
  description: Workspace configuration, environment, session, and learning workflows.
  category: productivity
components:
  skills:
    root: skills
    include: ["*/SKILL.md"]
  agents:
    - {id: explore, path: agents/orchestration/Explore.md}
    - {id: compatibility-translator, path: agents/orchestration/compatibility-translator.md}
    - {id: context-chronicler, path: agents/orchestration/context-chronicler.md}
    - {id: dependency-guardian, path: agents/orchestration/dependency-guardian.md}
    - {id: executor, path: agents/orchestration/executor.md}
    - {id: mech-executor, path: agents/orchestration/mech-executor.md}
    - {id: scout, path: agents/orchestration/scout.md}
    - {id: security-executor, path: agents/orchestration/security-executor.md}
    - {id: verifier, path: agents/orchestration/verifier.md}
    - {id: devpanel-chaos-engineer, path: agents/devpanel/chaos-engineer.md}
    - {id: devpanel-debugger, path: agents/devpanel/debugger.md}
    - {id: devpanel-developer, path: agents/devpanel/developer.md}
    - {id: devpanel-performance-auditor, path: agents/devpanel/performance-auditor.md}
    - {id: devpanel-spec-guard, path: agents/devpanel/spec-guard.md}
    - {id: devpanel-tester, path: agents/devpanel/tester.md}
  hooks:
    - id: claude-compaction-continuity
      path: hooks/session-continuity.json
      compatibility:
        claude: {mode: native}
        codex: {mode: not_applicable, reason: Codex exposes no verified completed-compaction lifecycle sequence.}
        gemini: {mode: not_applicable, reason: Gemini exposes no verified completed-compaction lifecycle sequence.}
        cursor: {mode: not_applicable, reason: Cursor exposes no verified completed-compaction lifecycle sequence.}
        antigravity: {mode: not_applicable, reason: Antigravity exposes no verified completed-compaction lifecycle sequence.}
        devin: {mode: not_applicable, reason: Devin exposes no verified completed-compaction lifecycle sequence.}
    - id: codex-session-start
      path: hooks/codex-lifecycle-events.json
      compatibility:
        claude: {mode: not_applicable, reason: This component records the Codex SessionStart surface only.}
        codex: {mode: native}
        gemini: {mode: not_applicable, reason: This component records the Codex SessionStart surface only.}
        cursor: {mode: not_applicable, reason: This component records the Codex SessionStart surface only.}
        antigravity: {mode: not_applicable, reason: This component records the Codex SessionStart surface only.}
        devin: {mode: not_applicable, reason: This component records the Codex SessionStart surface only.}
    - id: codex-stop
      path: hooks/codex-lifecycle-events.json
      compatibility:
        claude: {mode: not_applicable, reason: This component records the Codex Stop surface only.}
        codex: {mode: native}
        gemini: {mode: not_applicable, reason: This component records the Codex Stop surface only.}
        cursor: {mode: not_applicable, reason: This component records the Codex Stop surface only.}
        antigravity: {mode: not_applicable, reason: This component records the Codex Stop surface only.}
        devin: {mode: not_applicable, reason: This component records the Codex Stop surface only.}
    - id: codex-permission-request
      path: hooks/codex-lifecycle-events.json
      compatibility:
        claude: {mode: not_applicable, reason: This component records the Codex PermissionRequest surface only.}
        codex: {mode: native}
        gemini: {mode: not_applicable, reason: This component records the Codex PermissionRequest surface only.}
        cursor: {mode: not_applicable, reason: This component records the Codex PermissionRequest surface only.}
        antigravity: {mode: not_applicable, reason: This component records the Codex PermissionRequest surface only.}
        devin: {mode: not_applicable, reason: This component records the Codex PermissionRequest surface only.}
    - id: workspace-token-economy-context
      path: hooks/token-economy-context.json
      compatibility:
        claude: {mode: native}
        codex: {mode: native}
        gemini: {mode: not_applicable, reason: "Gemini already receives this guidance through the guidance component's generated contextFileName; a duplicate SessionStart hook is not a verified Gemini extension surface."}
        cursor: {mode: not_applicable, reason: "Cursor's hook events (beforeShellExecution etc.) have no SessionStart/always-on-context equivalent and CursorAdapter deliberately indexes bundles without inventing an activation mechanism; Cursor instead receives this guidance from the bootstrap-deployed configs/cursor/rules/orchestration.mdc."}
        antigravity: {mode: not_applicable, reason: Antigravity already receives this guidance through the guidance component's imported contextFileName; a duplicate SessionStart hook is not a verified Antigravity surface.}
        devin: {mode: not_applicable, reason: Devin has no SessionStart-equivalent hook execution surface.}
  runtime:
    - {id: session-continuity-scripts, path: skills/session-checkpoint/scripts}
    - {id: session-checkpoint-references, path: skills/session-checkpoint/references}
    - {id: learning-capture-scripts, path: skills/learning-capture/scripts}
    - {id: help-scripts, path: skills/help/scripts}
    - {id: command-catalog, path: skills/help/catalog/commands.json}
    - {id: env-check-scripts, path: skills/env-check/scripts}
    - {id: deploy-reconcile-scripts, path: skills/deploy-reconcile/scripts}
    - {id: hook-integration-scripts, path: skills/ai-hooks-integration/scripts}
    - {id: skill-evolve-scripts, path: skills/skill-evolve/scripts}
    - {id: pr-smoke-scripts, path: skills/pr-smoke/scripts}
  guidance:
    - {id: workspace-orchestration, path: guidance/orchestration.md}
    - id: workspace-token-economy
      path: guidance/token-economy.md
      compatibility:
        claude: {mode: not_applicable, reason: Claude Code's plugin.json has no context-injection field; delivered instead via the workspace-token-economy-context SessionStart hook.}
        codex: {mode: not_applicable, reason: Codex has no plugin guidance-file surface; delivered instead via the workspace-token-economy-context SessionStart hook.}
        gemini: {mode: generated}
        cursor: {mode: not_applicable, reason: "Cursor's plugin adapter indexes bundles without inventing an activation mechanism (see CursorAdapter); Cursor instead receives this guidance from the bootstrap-deployed configs/cursor/rules/orchestration.mdc."}
        antigravity: {mode: imported}
        devin: {mode: not_applicable, reason: 'MIGRATION BLOCKER — Devin single-owns ~/.codeium/windsurf/memories/global_rules.md exclusively for the manifest-i-have-adhd bundle (the Devin adapter''s _prepare_adhd_rule guard and the deploy_devin_adhd_rule step that writes it). Sharing that file across bundles requires extending the Devin adapter''s owned-file ownership model, which is out of scope here; /token-conserve remains available for Devin users until that adapter work ships.'}
capabilities:
  mcp:
    required: []
    default: [context7]
    optional: []
  executables:
    required: [bash, git, python3]
    default: []
    optional: [pass-cli, shellcheck, markdownlint-cli2, pytest, bats]
compatibility:
  claude: {mode: native}
  codex: {mode: native}
  gemini: {mode: generated}
  cursor: {mode: generated}
  antigravity: {mode: imported}
  devin: {mode: native}
