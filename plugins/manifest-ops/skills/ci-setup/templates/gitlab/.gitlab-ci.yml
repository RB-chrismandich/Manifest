# GitLab CI: Multi-Language Pipeline
# Runs conditional jobs based on which files changed in the MR/push.
# Supports: Python, Go, Node.js/TypeScript, Terraform
#
# Usage: Copy to .gitlab-ci.yml in your target repository.
# Customize the variables, versions, and rules as needed.

stages:
  - detect
  - lint
  - test
  - security
  - gate

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# ---------------------------------------------------------------------------
# Templates — reusable job fragments
# ---------------------------------------------------------------------------
.python_changes:
  rules:
    - changes:
        - "**/*.py"
        - pyproject.toml
        - setup.cfg
        - "requirements*.txt"
        - Pipfile*
        - poetry.lock

.go_changes:
  rules:
    - changes:
        - "**/*.go"
        - go.mod
        - go.sum

.node_changes:
  rules:
    - changes:
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.js"
        - "**/*.jsx"
        - package.json
        - package-lock.json
        - pnpm-lock.yaml
        - yarn.lock
        - bun.lock

.terraform_changes:
  rules:
    - changes:
        - "**/*.tf"
        - "**/*.tfvars"
        - .terraform.lock.hcl

# ---------------------------------------------------------------------------
# Python
# ---------------------------------------------------------------------------
python:lint:
  stage: lint
  image: python:3.14-slim
  extends: .python_changes
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  before_script:
    - pip install --upgrade pip ruff
  script:
    - ruff check .
    - ruff format --check .

python:test:
  stage: test
  image: python:3.14-slim
  extends: .python_changes
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  before_script:
    - pip install --upgrade pip pytest pytest-cov
    - |
      if [ -f pyproject.toml ]; then
        pip install -e ".[dev]" 2>/dev/null || pip install -e .
      elif [ -f requirements.txt ]; then
        pip install -r requirements.txt
      fi
  script:
    - pytest --cov --cov-report=xml --cov-report=term-missing -q
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always

python:security:
  stage: security
  image: python:3.14-slim
  extends: .python_changes
  before_script:
    - pip install --upgrade pip bandit pip-audit
  script:
    - bandit -r . -q -ll || true
    - |
      if [ -f requirements.txt ]; then
        pip-audit -r requirements.txt --desc || true
      elif [ -f pyproject.toml ]; then
        pip-audit --desc || true
      fi
  allow_failure: true

# ---------------------------------------------------------------------------
# Go
# ---------------------------------------------------------------------------
go:lint:
  stage: lint
  image: golangci/golangci-lint:latest
  extends: .go_changes
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/go
  script:
    - golangci-lint run --timeout 5m

go:test:
  stage: test
  image: golang:1.26
  extends: .go_changes
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/go
  script:
    - go vet ./...
    - go test -race -coverprofile=coverage.out -covermode=atomic ./...
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.out
    when: always

go:security:
  stage: security
  image: golang:1.26
  extends: .go_changes
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - govulncheck ./... || true
  allow_failure: true

# ---------------------------------------------------------------------------
# Node.js / TypeScript
# ---------------------------------------------------------------------------
node:lint:
  stage: lint
  image: node:24-slim
  extends: .node_changes
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/npm
      - node_modules/
  before_script:
    - npm ci || yarn install --frozen-lockfile || true
  script:
    - npx eslint . || true

node:test:
  stage: test
  image: node:24-slim
  extends: .node_changes
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/npm
      - node_modules/
  before_script:
    - npm ci || yarn install --frozen-lockfile || true
  script:
    - npm run test -- --coverage 2>/dev/null || npm test || true
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    when: always

node:security:
  stage: security
  image: node:24-slim
  extends: .node_changes
  before_script:
    - npm ci || yarn install --frozen-lockfile || true
  script:
    - npm audit --omit=dev || true
  allow_failure: true

# ---------------------------------------------------------------------------
# Terraform
# ---------------------------------------------------------------------------
terraform:lint:
  stage: lint
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  extends: .terraform_changes
  script:
    - terraform fmt -check -recursive

terraform:validate:
  stage: test
  image:
    name: hashicorp/terraform:latest
    entrypoint: [""]
  extends: .terraform_changes
  script:
    - |
      for dir in $(find . -name '*.tf' -not -path '*/.terraform/*' -exec dirname {} \; | sort -u); do
        echo "Validating $dir"
        cd "$dir"
        terraform init -backend=false
        terraform validate
        cd "$CI_PROJECT_DIR"
      done

terraform:security:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  extends: .terraform_changes
  script:
    - trivy config --severity HIGH,CRITICAL . || true
  allow_failure: true

# ---------------------------------------------------------------------------
# Secret scanning
# ---------------------------------------------------------------------------
secret-scan:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - gitleaks detect --source . --verbose

# ---------------------------------------------------------------------------
# Gate — aggregates all jobs for MR approval
# ---------------------------------------------------------------------------
ci-gate:
  stage: gate
  image: alpine:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: secret-scan
      optional: true
    - job: python:lint
      optional: true
    - job: python:test
      optional: true
    - job: go:lint
      optional: true
    - job: go:test
      optional: true
    - job: node:lint
      optional: true
    - job: node:test
      optional: true
    - job: terraform:lint
      optional: true
    - job: terraform:validate
      optional: true
  script:
    - echo "All required CI jobs passed (or were skipped)."
