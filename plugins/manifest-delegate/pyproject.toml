[project]
name = "manifest-delegate-runtime"
version = "0.1.0"
description = "Standalone installed runtime for the Manifest delegate plugin"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
manifest-delegate = "manifest_delegate.cli:main"


[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manifest_delegate"]

[tool.hatch.build.targets.wheel.force-include]
"config/backends.json" = "manifest_delegate/config/backends.json"
"manifest_delegate_policy.py" = "manifest_delegate_policy.py"
"vendor/model-policy.zip" = "vendor/model-policy.zip"
