# GitHub Actions: Automated Release Pipeline
# Creates semantically versioned releases with auto-generated release notes.
#
# Trigger: Push a tag matching `v*` (e.g., `v1.2.3`) or run manually.
# Also supports automated semver bumps via workflow_dispatch.
#
# Usage: Copy to .github/workflows/release.yml in your target repository.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Pre-release label (e.g., beta, rc.1). Leave empty for stable.'
        required: false
        type: string
      dry_run:
        description: 'Dry run (skip actual release creation)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------------
  # Compute the next version (only for workflow_dispatch)
  # ---------------------------------------------------------------------------
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semver.outputs.tag }}
      version: ${{ steps.semver.outputs.version }}
      is_prerelease: ${{ steps.semver.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: semver
        run: |
          # Get latest tag
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $latest_tag"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push — use the pushed tag directly
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
            is_prerelease="false"
            if [[ "$version" == *"-"* ]]; then
              is_prerelease="true"
            fi
          else
            # workflow_dispatch — compute next version
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "${version%%-*}"

            case "${{ inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac

            version="${major}.${minor}.${patch}"
            is_prerelease="false"

            if [[ -n "${{ inputs.prerelease }}" ]]; then
              version="${version}-${{ inputs.prerelease }}"
              is_prerelease="true"
            fi

            tag="v${version}"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "Computed: tag=$tag version=$version prerelease=$is_prerelease"

  # ---------------------------------------------------------------------------
  # Build release artifacts (customize per project)
  # ---------------------------------------------------------------------------
  build:
    name: Build artifacts
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          echo "Building release ${{ needs.version.outputs.version }}..."
          # --- Customize build steps for your project ---
          # Examples:
          #   Python:   python -m build
          #   Go:       goreleaser release --snapshot --clean
          #   Node.js:  npm run build && npm pack
          #   Docker:   docker build -t myapp:${{ needs.version.outputs.tag }} .
          echo "Build complete."

      - name: Generate checksums
        run: |
          mkdir -p dist
          # Add your build artifacts to dist/ then:
          if ls dist/* 1>/dev/null 2>&1; then
            cd dist
            sha256sum * > SHA256SUMS.txt
            cd ..
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Generate release notes from conventional commits
  # ---------------------------------------------------------------------------
  release-notes:
    name: Generate release notes
    needs: version
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate notes
        id: notes
        run: |
          tag="${{ needs.version.outputs.tag }}"

          # Find previous tag
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [[ -z "$prev_tag" ]]; then
            range="HEAD"
          else
            range="${prev_tag}..HEAD"
          fi

          # Categorize commits using conventional commit prefixes
          features=$(git log "$range" --pretty=format:"- %s (%h)" --grep="^feat" --no-merges 2>/dev/null || true)
          fixes=$(git log "$range" --pretty=format:"- %s (%h)" --grep="^fix" --no-merges 2>/dev/null || true)
          docs=$(git log "$range" --pretty=format:"- %s (%h)" --grep="^docs" --no-merges 2>/dev/null || true)
          perf=$(git log "$range" --pretty=format:"- %s (%h)" --grep="^perf" --no-merges 2>/dev/null || true)
          breaking=$(git log "$range" --pretty=format:"- %s (%h)" --grep="BREAKING CHANGE\|^feat!:\|^fix!:" --no-merges 2>/dev/null || true)
          other=$(git log "$range" --pretty=format:"- %s (%h)" \
            --no-merges --invert-grep \
            --grep="^feat\|^fix\|^docs\|^perf\|^chore\|^ci\|^test\|^style\|^refactor\|^build" \
            2>/dev/null || true)

          notes=""

          if [[ -n "$breaking" ]]; then
            notes+=$'\n## Breaking Changes\n'"$breaking"$'\n'
          fi
          if [[ -n "$features" ]]; then
            notes+=$'\n## Features\n'"$features"$'\n'
          fi
          if [[ -n "$fixes" ]]; then
            notes+=$'\n## Bug Fixes\n'"$fixes"$'\n'
          fi
          if [[ -n "$perf" ]]; then
            notes+=$'\n## Performance\n'"$perf"$'\n'
          fi
          if [[ -n "$docs" ]]; then
            notes+=$'\n## Documentation\n'"$docs"$'\n'
          fi
          if [[ -n "$other" ]]; then
            notes+=$'\n## Other Changes\n'"$other"$'\n'
          fi

          if [[ -z "$notes" ]]; then
            notes=$'\nNo categorized changes since '"$prev_tag"$'.\n'
          fi

          # Append contributors
          contributors=$(git log "$range" --pretty=format:"%an" --no-merges | sort -u | while read -r name; do echo "- $name"; done)
          if [[ -n "$contributors" ]]; then
            notes+=$'\n## Contributors\n'"$contributors"$'\n'
          fi

          # Write to file for multi-line output
          echo "$notes" > /tmp/release_notes.md

          # Also set as output (escaped for GitHub Actions)
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: /tmp/release_notes.md

  # ---------------------------------------------------------------------------
  # Create the GitHub release
  # ---------------------------------------------------------------------------
  release:
    name: Create release
    needs: [version, build, release-notes]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist/
        continue-on-error: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: /tmp/

      - name: Create tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(
            "${{ needs.version.outputs.tag }}"
            --title "${{ needs.version.outputs.tag }}"
            --notes-file /tmp/release_notes.md
          )

          if [[ "${{ needs.version.outputs.is_prerelease }}" == "true" ]]; then
            args+=(--prerelease)
          fi

          # Attach artifacts if they exist
          if ls dist/* 1>/dev/null 2>&1; then
            args+=(dist/*)
          fi

          gh release create "${args[@]}"

      - name: Summary
        run: |
          echo "## Release ${{ needs.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: ${{ needs.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Pre-release**: ${{ needs.version.outputs.is_prerelease }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
