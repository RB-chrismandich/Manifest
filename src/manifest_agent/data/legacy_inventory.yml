# Bootstrap outputs that may be changed during the native-plugin cutover.
# Paths are deliberately literal and use only HOME expansion; anything not
# listed here is user-owned and is never mutated by the coordinator.
categories:
  - skills
  - agents
  - guidance
  - hooks
  - permissions
  - mcp
  - scripts
  - optional_tools
  - configuration
  - diagnostics
  - updates
  - uninstall
entries:
  - id: claude-shared-skills
    category: skills
    path: ~/.claude/skills
    harnesses: [claude]
    classification: bundle-owned
    destination: native-plugin-managers
    ownership_proof: {type: symlink-target, value: ~/.manifest/skills}
    action: disable
    recovery: restore-symlink
    parity_test: plugin_migration.bats
  - id: codex-shared-skills
    category: skills
    path: ~/.codex/skills
    harnesses: [codex]
